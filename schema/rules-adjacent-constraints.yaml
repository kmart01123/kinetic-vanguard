schema_version: "1.1.0"
constraints:
  - schema_path: "/properties/entities/items/properties/kind"
    rationale: "Entity structural kinds drive required renderer behavior and conditional classification."
    authority_owner: "Kinetic Vanguard maintainers"
  - schema_path: "/properties/content/$defs/block/properties/type"
    rationale: "Closed rich-text node kinds are application structure, not game rules."
    authority_owner: "Kinetic Vanguard maintainers"
  - schema_path: "/properties/facets/items/properties/cardinality"
    rationale: "Facet cardinality is required application behavior."
    authority_owner: "Kinetic Vanguard maintainers"
  - schema_path: "/$defs/onboardingDestination/properties/kind"
    rationale: "Closed onboarding destination kinds define application navigation without creating publishable rules entities."
    authority_owner: "Kinetic Vanguard maintainers"
  - schema_path: "/$defs/harnessDiscipline"
    rationale: "Closed discipline IDs, signature saves, damage types, and mastery shapes make the canonical rules projection deterministic."
    authority_owner: "Kinetic Vanguard maintainers"
  - schema_path: "/$defs/harnessControlTier"
    rationale: "Closed control outcomes, restrictions, repeat saves, and durations prevent prose inference in maintained benchmark tooling."
    authority_owner: "Kinetic Vanguard maintainers"
  - schema_path: "/$defs/harnessFeatureRule"
    rationale: "Stable entity-ID joins and closed targeting/repeatability mechanics keep Python free of parallel Kinetic Vanguard rule tables."
    authority_owner: "Kinetic Vanguard maintainers"
