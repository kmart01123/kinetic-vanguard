  - classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Declare that you are Overloading a rider or standalone feature when you declare that feature — for a rider, before the Manifested Strike attack roll. Manifested Strike itself can never be Overloaded and never generates Blood Tax.
            type: text
        type: paragraph
      - inlines:
          - text: "Overload is a deliberate escalation that trades hit points for power. It applies to your techniques — riders and standalone psionic features — and never to Manifested Strike itself: the strike cannot be Overloaded and never generates Blood Tax. An Overload is declared when you declare the feature it escalates — for a rider, before the attack roll. Two tiers exist, both gated by Fighter level. As a general principle, Overload tiers are cumulative: Tier 2 includes every effect of Tier 1 unless it explicitly replaces it (some riders say “instead” to swap an effect rather than stack it). Each tier’s text states whether it adds to or replaces the lower tier’s effect."
            type: text
        type: paragraph
      - inlines:
          - text: The Blood Tax
            type: text
        kind: note
        type: note
      - body:
          - inlines:
              - text: (3rd level) You may Overload a rider or standalone feature to Tier 1, gaining the effect listed in its text. You take psychic self-damage equal to your Proficiency Bonus (Blood Tax), paid when you declare the Overload, whether or not the attack hits.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: (10th level) You may Overload a rider or standalone feature to Tier 2, gaining the effects listed in its text. Within each Attack action, only one rider can be Tier 2. Action Surge creates a new Attack action and a fresh Tier 2 rider window. This rider limit does not restrict standalone features.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
      - body:
          - inlines:
              - text: "Before rolling, you declare: “Glacial Spike T2.”"
                type: emphasis
            type: paragraph
          - inlines:
              - text: "Your strike uses its level-set die: 1d10. The Tier 2 declaration is on Glacial Spike — the strike itself can never be Overloaded."
                type: text
            type: paragraph
          - inlines:
              - text: "Hit: Manifested Strike deals 1d10 + 3, and Glacial Spike adds 2 cold damage, for 1d10 + 5 total. On a failed Con save, the target is Restrained until the end of your next turn."
                type: text
            type: paragraph
          - inlines:
              - text: "Blood Tax: 1 × 2 × PB = 2 × 4 = 8, paid on declaration. Glacial Spike is a Signature Rider and costs 0 Psi; Tier 2 escalates its control."
                type: text
            type: paragraph
          - inlines:
              - text: "Miss: No effects; Blood Tax (8) is still paid — it was spent on declaration. Glacial Spike costs 0 Psi. Roll your next attack."
                type: text
            type: paragraph
        tier: 2
        title:
          - text: Example — Level 11 Cryokinesis (PB 4, Int +3)
            type: strong
        type: example
      - inlines:
          - text: The full attack package — rider activation and rider Overload tier — is declared before the roll. One rider per hit (discipline or Advanced Training). A hit resolves the whole package. A miss cancels rider effects, but Psi and Blood Tax are still spent — Blood Tax is paid immediately on declaration, never after the attack resolves. If you Overload more than one feature in the same turn (a rider and a standalone feature, say), you pay Blood Tax once per Overload declared.
            type: text
        kind: note
        type: note
      - inlines:
          - text: "⚠ Declare the full package before the roll — one rider and its Overload tier. Hit: everything resolves. Miss: Psi AND Blood Tax are still spent; no effects. (Exception: effects that explicitly trigger on a miss, such as the Graze mastery, still resolve.)"
            type: text
        kind: note
        type: note
      - inlines:
          - text: ⚠ Blood Tax is psychic damage. Resistance to psychic damage halves it normally. Immunity to psychic damage treats it as Resistance against Blood Tax instead of preventing it. Regardless of the source of reduction, you take at least half the declared Blood Tax, rounded down, unless Overload Mastery specifically says otherwise.
            type: text
        kind: note
        type: note
      - inlines:
          - text: Attack Declaration Costs
            type: text
        type: paragraph
      - headers:
          - - text: Declaration
              type: text
          - - text: Psi
              type: text
          - - text: Blood Tax
              type: text
          - - text: Notes
              type: text
        rows:
          - - - text: MS (no rider)
                type: text
            - - text: "0"
                type: text
            - - text: None
                type: text
            - - text: Always available
                type: text
          - - - text: MS + Tier 0 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: None
                type: text
            - - text: Signature Rider is unlimited; other attack riders are once per Attack action
                type: text
          - - - text: MS + T1 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: PB
                type: text
            - - text: Paid on declaration, hit or miss
                type: text
          - - - text: MS + T2 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: 2×PB
                type: text
          - - - text: Overloaded standalone feature
                type: text
            - - text: Feature cost
                type: text
            - - text: Per its tier*
                type: text
          - - - text: Rider OL + standalone OL (same turn)
                type: text
            - - text: Rider cost + feature cost
                type: text
            - - text: Sum both*
                type: text
            - - text: Two Blood Taxes
                type: text
        type: table
      - inlines:
          - text: "*Blood Tax per tier: PB at Tier 1, 2×PB at Tier 2. Each Overload declared pays independently — an Overloaded rider plus an Overloaded standalone feature in the same turn means two separate Blood Taxes. Any Psi cost and Blood Tax are spent on declaration (hit or miss). Tier 0 riders cost their listed Psi but no HP; Signature Riders cost 0 Psi at every tier. Only T1+ Overloads incur Blood Tax. Manifested Strike itself never appears in this math — it cannot be Overloaded."
            type: text
        type: paragraph
      - inlines:
          - text: "Blood Tax per Overload declared: Tier 1 = PB. Tier 2 = 2×PB. Sum all Overloads in the sequence."
            type: text
        type: paragraph
      - inlines:
          - text: Tier 2 costs 2×PB because it includes Tier 1’s PB plus PB more. Tier 0 riders cost 0 HP. A double-Overload turn (e.g., a Tier 1 Vectored Thrust plus a Tier 2 rider) pays each Overload separately.
            type: text
        type: paragraph
      - inlines:
          - text: "Critical Hits and Riders: On a critical hit with Manifested Strike, double only the Manifested Strike's damage dice. Damage dice dealt by a rider are never doubled by a critical hit, regardless of whether the rider damages the struck creature, another creature, or multiple creatures. Flat damage, saving throws, conditions, forced movement, and all other rider effects resolve normally. Standalone features are not riders and are unaffected by this rule."
            type: text
        type: paragraph
      - inlines:
          - text: "Using Overload: For a rider, declare the rider and its tier before the attack roll. A hit resolves the declared package; a miss does not resolve the rider, but Psi and Blood Tax remain spent. Standalone features are declared and paid for when activated."
            type: text
        type: paragraph
      - inlines:
          - text: "Damage Immunity and Riders: Discipline riders deal your Discipline’s damage type unless stated otherwise. Advanced Training riders deal the damage type listed in their text. Damage immunity prevents only the matching damage; it does not skip the rider’s saving throw or other effects. For example, a cold-immune creature can still be Restrained by Snow Chains, and a fire-immune creature can still be Blinded by Flare."
            type: text
        type: paragraph
      - inlines:
          - text: "Concentration Startup Exception: The Blood Tax from the activation that starts a concentration feature does not trigger a concentration check. Only subsequent Blood Tax and other damage sources require checks as normal. Standard concentration rules still apply — you can only concentrate on one feature at a time."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Blood Tax and Temporary Hit Points: Blood Tax bypasses Temporary Hit Points and is deducted directly from your current Hit Points. Temporary Hit Points cannot absorb, reduce, or pay Blood Tax. Blood Tax remains psychic damage for Resistance, concentration checks, and effects that trigger when you take damage."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Blood Tax at 0 Hit Points: Blood Tax is paid before the declared attack or feature resolves. If it reduces you to 0 hit points, you fall Unconscious immediately and the declared attack or feature does not resolve. Any Psi spent and Blood Tax paid remain spent."
            type: text
        kind: note
        type: note
