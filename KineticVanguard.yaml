      - inlines:
          - source_unit_id: u_l0455_c001_paragraph_960d9077e9
            text: "T0 Base: Choose one creature you can see within 60 feet. The target must make a Strength saving throw, taking 8d10 force damage on a failed save, or half as much on a successful one. On a failed save, the target is also pushed 10 ft in any horizontal direction you choose."
