    id: subclass_feature_reference
    kind: progression
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    progression_section: reference
    publishable: true
    title: Subclass Feature Reference
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "Choose one of the following as your Psionic Ability: Intelligence, Wisdom, or Charisma. You use your Psionic Ability for Manifested Strike attack and damage rolls, saving throw DCs, and all subclass features that reference your Psionic Ability."
            type: text
        type: paragraph
      - inlines:
          - text: Psionic save DC = 8 + Proficiency Bonus + Psionic Ability modifier
            type: text
        type: paragraph
    id: common_psionic_discipline
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Psionic Discipline
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Each Discipline has one signature saving throw, used by any feature that calls for your “signature save” (such as Improved Phase Step). Pyrokinesis uses Dexterity, Cryokinesis uses Constitution, Psychokinesis uses Strength, and Electrokinesis uses Charisma. This is the saving throw the target makes against those features; it does not change any save another feature already specifies.
            type: text
        type: paragraph
    id: common_discipline_signature_save
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Discipline Signature Save
  - classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Your Psi Points equal half your Fighter level (rounded up) + your Proficiency Bonus. You regain all expended Psi Points on a short or long rest.
            type: text
        type: paragraph
