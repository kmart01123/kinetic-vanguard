  - activation: action
    classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - psychokinesis
    content:
      - inlines:
          - source_unit_id: u_l0463_c001_paragraph_9be9c71d92
            text: "T0 Base: Choose up to five Medium or smaller creatures within 60 ft, or up to two Large creatures. Huge or larger creatures are immune. Each target must make a Str save. On a failed save, it is lifted 30 ft into the air and Restrained (hovering). On a successful save, it is unaffected. At the start of each affected creature’s turn, it must repeat the Str save; on a successful save, it descends safely and the effect ends for that creature. While concentration is maintained, creatures that remain Restrained continue to hover. If concentration ends, all affected creatures fall."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0466_c001_paragraph_6a14256b75
            text: "T1 Overload: Changes from Tier 0: Levitated creatures have disadvantage on the repeat Str save against this feature. At the start of each of your turns, you may move each creature still levitated by this feature up to 15 ft in any direction to an unoccupied space you can see. This is forced movement; the creature remains lifted and Restrained throughout."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0468_c001_paragraph_fdc8e1b49d
            text: "T2 Overload: Changes from Tier 1: At the start of each levitated creature’s turn, it first repeats the Strength saving throw from Tier 0. On a successful save, it descends safely and takes no damage from this tier. On a failed save, it remains levitated and takes force damage equal to 2× your Psionic Ability modifier."
            type: text
        type: paragraph
