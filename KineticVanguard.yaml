  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "When you gain this subclass at Fighter level 3, choose one Kinetic Discipline:"
            type: text
        type: paragraph
      - items:
          - - text: Pyrokinesis
              type: text
          - - text: Cryokinesis
              type: text
          - - text: Psychokinesis
              type: text
          - - text: Electrokinesis
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "Your chosen Discipline determines:"
            type: text
        type: paragraph
      - items:
          - - text: your Manifested Strike’s damage type
              type: text
          - - text: your Discipline signature saving throw
              type: text
          - - text: your Kinetic Mastery
              type: text
          - - text: your Signature Rider
              type: text
          - - text: the Discipline features you gain at Fighter levels 3, 7, 10, 15, and 20
              type: text
        style: unordered
        type: list
      - inlines:
          - text: This choice is permanent and is separate from your Psionic Ability choice.
            type: text
        type: paragraph
      - inlines:
          - text: Choose Intelligence, Wisdom, or Charisma as your Psionic Ability. Your Psionic Ability choice does not change your Discipline.
            type: text
        type: paragraph
      - inlines:
          - text: Your Psionic Ability modifier is the ability modifier for the ability you chose. Your Manifested Strike attack bonus includes this modifier, and you add the modifier to the strike’s damage roll. Use it whenever another subclass feature refers to your Psionic Ability.
            type: text
        type: paragraph
      - inlines:
          - text: Psionic saving throw Difficulty Class = 8 + your Proficiency Bonus + your Psionic Ability modifier
            type: text
        type: paragraph
    id: common_psionic_discipline
    kind: feature
    level: 3
    presentation_metadata:
