    id: subclass_feature_reference
    kind: progression
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    progression_section: reference
    publishable: true
    title: Subclass Feature Reference
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Choose Intelligence, Wisdom, or Charisma as your Psionic Ability. You use that ability for Manifested Strike attack and damage rolls, your Psionic save DC, and every subclass feature that refers to your Psionic Ability.
            type: text
        type: paragraph
      - inlines:
          - text: Psionic save DC = 8 + your Proficiency Bonus + your Psionic Ability modifier
            type: text
        type: paragraph
    id: common_psionic_discipline
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Psionic Discipline
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "Each Discipline has a signature saving throw used by features that specifically call for it, such as Improved Phase Step: Dexterity for Pyrokinesis, Constitution for Cryokinesis, Strength for Psychokinesis, and Charisma for Electrokinesis. This does not change a saving throw specified by another feature."
            type: text
        type: paragraph
    id: common_discipline_signature_save
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Discipline Signature Save
  - classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Your maximum Psi Points equal half your Fighter level, rounded up, plus your Proficiency Bonus. You regain all expended Psi Points when you finish a Short or Long Rest.
            type: text
        type: paragraph
      - headers:
          - - text: Fighter Level
              type: text
          - - text: Proficiency Bonus
              type: text
          - - text: Psi Points
              type: text
