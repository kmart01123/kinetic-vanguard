    content:
      - inlines:
          - text: Overload strengthens a rider or standalone psionic feature. Choose an available Overload tier when you declare that feature.
            type: text
        type: paragraph
      - items:
          - - text: "Rider: "
              type: strong
            - text: Declare Tier 1 or Tier 2 immediately before the Manifested Strike attack roll.
              type: text
          - - text: "Standalone feature: "
              type: strong
            - text: Declare the tier when you activate the feature.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: Pay Blood Tax immediately when you declare an Overload. Blood Tax is psychic damage.
            type: text
        type: paragraph
      - items:
          - - text: "Tier 1: "
              type: strong
            - text: Costs an amount equal to your Proficiency Bonus.
              type: text
          - - text: "Tier 2: "
              type: strong
            - text: Costs twice your Proficiency Bonus in total.
              type: text
          - - text: "Manifested Strike: "
              type: strong
            - text: Cannot be Overloaded and never generates Blood Tax.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: A rider resolves only on a hit. If the attack misses, the rider does not resolve, but its declared Psi and Blood Tax remain spent. An effect that explicitly triggers on a miss, such as Graze, still resolves.
            type: text
        type: paragraph
      - inlines:
          - text: "Overload has two tiers, and each becomes available at the Fighter level shown below. The tiers are cumulative: Tier 2 includes every Tier 1 effect unless its text explicitly replaces that effect. Each tier states whether it adds to or replaces the lower-tier effect."
            type: text
        type: paragraph
      - body:
          - inlines:
              - text: (3rd level) Tier 1 becomes available.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: (10th level) Tier 2 becomes available. Tier 2’s Blood Tax replaces the Tier 1 amount. It does not add to it. A Tier 2 Overload costs twice your Proficiency Bonus in total.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
      - body:
          - inlines:
              - text: Before rolling, you declare Glacial Spike at Tier 2.
                type: emphasis
            type: paragraph
          - inlines:
              - text: At level 11, your Manifested Strike die is 1d10. Tier 2 applies to Glacial Spike; Manifested Strike itself cannot be Overloaded.
                type: text
            type: paragraph
          - items:
              - - text: "Hit: "
                  type: strong
                - text: Manifested Strike deals 1d10 + 3 cold damage, and Glacial Spike adds 2 cold damage, for 1d10 + 5 total. On a failed Constitution saving throw, the target is Restrained until the end of your next turn.
                  type: text
              - - text: "Blood Tax: "
                  type: strong
                - text: 2 × Proficiency Bonus = 2 × 4 = 8, paid on declaration. Glacial Spike costs 0 Psi because it is a Signature Rider.
                  type: text
              - - text: "Miss: "
                  type: strong
                - text: Glacial Spike does not resolve, but the 8 Blood Tax remains spent because you paid it on declaration. Glacial Spike costs 0 Psi. Roll your next attack.
                  type: text
            style: unordered
            type: list
        tier: 2
        title:
          - text: Example — Level 11 Cryokinesis (Proficiency Bonus 4, Intelligence +3)
            type: strong
        type: example
      - inlines:
          - text: Overload Cost Reference
            type: text
        type: paragraph
      - headers:
          - - text: Declaration
              type: text
          - - text: Psi
              type: text
          - - text: Blood Tax
              type: text
          - - text: Notes
              type: text
        rows:
          - - - text: Manifested Strike (no rider)
                type: text
            - - text: "0"
                type: text
            - - text: None
                type: text
            - - text: Always available
                type: text
          - - - text: Manifested Strike + Tier 0 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: None
                type: text
            - - text: Signature Rider is repeatable at every tier; other riders are once per Attack action
                type: text
          - - - text: Manifested Strike + Tier 1 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: Proficiency Bonus
                type: text
            - - text: Paid on declaration, hit or miss
                type: text
          - - - text: Manifested Strike + Tier 2 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: 2 × Proficiency Bonus in total
                type: text
            - - text: Only one Tier 2 rider per Attack action
                type: text
          - - - text: Overloaded standalone feature
                type: text
            - - text: Feature cost
                type: text
            - - text: "Tier 1: Proficiency Bonus; Tier 2: 2 × Proficiency Bonus in total"
                type: text
            - - text: Paid when activated
                type: text
          - - - text: Overloaded rider + overloaded standalone feature
                type: text
            - - text: Rider cost + feature cost
                type: text
            - - text: Sum both
                type: text
            - - text: Each Overload pays separately
                type: text
        type: table
      - inlines:
          - text: "Multiple Overloads and Tier 2 Riders:"
            type: text
        type: paragraph
      - items:
          - - text: If you Overload more than one feature in the same turn, pay Blood Tax separately for each Overload.
              type: text
          - - text: Within each Attack action, only one rider can be Tier 2.
              type: text
          - - text: Action Surge creates a new Attack action and a new Tier 2 rider allowance.
              type: text
          - - text: This limit does not restrict standalone features.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "Critical Hits and Riders:"
            type: text
        type: paragraph
      - items:
          - - text: On a critical hit with Manifested Strike, double only the Manifested Strike damage dice.
              type: text
          - - text: Damage dice dealt by a rider are never doubled, regardless of which creatures the rider damages.
              type: text
          - - text: Flat damage, saving throws, conditions, forced movement, and other rider effects resolve normally.
              type: text
          - - text: Standalone features are unaffected by this rule.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "Damage Immunity and Riders:"
            type: text
        type: paragraph
      - items:
          - - text: Discipline riders deal your Discipline’s damage type unless stated otherwise.
              type: text
          - - text: Advanced Training riders deal the damage type listed in their text.
              type: text
          - - text: Damage immunity prevents only matching damage; it does not prevent the rider’s saving throw or other effects.
              type: text
          - - text: For example, a cold-immune creature can still be Restrained by Snow Chains, and a fire-immune creature can still be Blinded by Flare.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "Blood Tax Resistance and Immunity: Resistance to psychic damage halves Blood Tax normally. Immunity to psychic damage instead functions as Resistance against Blood Tax. Regardless of the source of reduction, you take at least half the declared Blood Tax, rounded down, unless Overload Mastery specifically says otherwise."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Concentration Startup Exception: When you activate a concentration feature with Overload, the Blood Tax paid for that activation does not trigger a concentration saving throw for the feature being activated. After activation, subsequent damage—including later Blood Tax—forces concentration saving throws as normal. Standard concentration rules still apply—you can concentrate on only one feature at a time."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Blood Tax and Temporary Hit Points: Blood Tax bypasses Temporary Hit Points and is deducted directly from your current Hit Points. Temporary Hit Points cannot absorb, reduce, or pay Blood Tax. Blood Tax remains psychic damage for Resistance, concentration checks, and effects that trigger when you take damage."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Blood Tax at 0 Hit Points: Blood Tax is paid before the declared attack or feature resolves. If it reduces you to 0 hit points, you fall Unconscious immediately and the declared attack or feature does not resolve. Any Psi spent and Blood Tax paid remain spent."
            type: text
        kind: note
        type: note
