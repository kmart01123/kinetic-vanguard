    content:
      - inlines:
          - source_unit_id: u_l0180_c001_paragraph_72a0b78bba
            text: You can communicate telepathically with one or more creatures you can see within 60 feet, provided you share a common language with each creature. When you address multiple creatures, each receives the same message. A recipient can reply telepathically to you, but recipients cannot communicate directly with one another through this feature. This communication does not grant mind reading.
            type: text
        type: paragraph
