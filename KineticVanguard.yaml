    id: common_psi_reservoir
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Psi Reservoir
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: You can communicate telepathically with one or more creatures you can see within 60 feet, provided you share a language with each creature.
            type: text
        type: paragraph
      - items:
          - - text: "Multiple recipients: "
              type: strong
            - text: When you address multiple creatures, each receives the same message.
              type: text
          - - text: "Replies: "
              type: strong
            - text: A recipient can reply telepathically to you.
              type: text
          - - text: "Recipient isolation: "
              type: strong
            - text: Recipients cannot communicate with one another through this feature.
              type: text
          - - text: "Thought reading: "
              type: strong
            - text: Psionic Link does not let you read thoughts.
              type: text
        style: unordered
        type: list
    id: common_psionic_link
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Psionic Link
  - activation: action
    classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - common_features
    content:
      - inlines:
          - text: When you take the Attack action, you can replace any number of your weapon attacks with Manifested Strikes. A Manifested Strike is a special ranged psionic attack with a range of 60 feet.
            type: text
        type: paragraph
      - inlines:
          - text: Your attack bonus equals your Psionic Ability modifier + your Proficiency Bonus + your Psionic Focus bonus. Psionic Focus is +1 at Fighter levels 3–8, +2 at levels 9–16, and +3 at levels 17–20.
            type: text
        type: paragraph
      - inlines:
          - text: On a hit, the strike deals one Manifested Strike die + your Psionic Ability modifier. Your Discipline determines the strike’s damage type.
            type: text
        type: paragraph
      - inlines:
          - text: "Manifested Strike die by level: 1d6 (3rd–4th) → 1d8 (5th–10th) → 1d10 (11th–16th) → 1d12 (17th–20th)"
            type: text
        type: paragraph
      - headers:
          - - text: Fighter Level
              type: text
          - - text: Manifested Strike Die
              type: text
        rows:
          - - - text: 3–4
                type: text
            - - text: 1d6
                type: text
          - - - text: 5–10
                type: text
            - - text: 1d8
                type: text
          - - - text: 11–16
                type: text
            - - text: 1d10
                type: text
          - - - text: 17–20
                type: text
            - - text: 1d12
                type: text
        type: table
      - inlines:
          - text: Manifested Strike costs no Psi.
            type: text
        type: paragraph
      - inlines:
          - text: On a critical hit, double only the Manifested Strike damage dice. Rider damage dice do not double.
            type: text
        type: paragraph
      - inlines:
          - text: For feats, Fighting Styles, and other features that refer to ranged weapons or attacks made with them, treat Manifested Strike as an attack made with a ranged weapon with which you are proficient. It is not a weapon, spell, or object for any other purpose.
            type: text
        type: paragraph
      - inlines:
          - text: "Magical Effects:"
            type: text
        type: paragraph
      - items:
          - - text: "Classification: "
              type: strong
            - text: Manifested Strike, every rider, and every standalone psionic feature are magical effects. None is a spell or Magic action.
              type: text
          - - text: "Countermagic and spell triggers: "
              type: strong
            - text: They cannot be Counterspelled or dispelled and do not trigger features that require casting a spell.
              type: text
          - - text: "Magic Resistance: "
              type: strong
            - text: Creatures with Magic Resistance or a similar trait have advantage on saving throws imposed by these features; Manifested Strike attack rolls and damage are unaffected.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "Somatic Requirement: You project Manifested Strike from one hand and must have the free use of that hand to perform its psionic gesture."
            type: text
        type: paragraph
      - items:
          - - text: A hand is free if it is not holding or manipulating a weapon, Shield, object, or creature.
              type: text
          - - text: You can release one hand from a Two-Handed weapon, make the Manifested Strike, and re-grip the weapon before a later attack in the same Attack action.
              type: text
          - - text: Releasing or replacing a hand on a weapon you continue to hold requires no action and does not equip or unequip it.
              type: text
          - - text: Features delivered through Manifested Strike inherit this requirement unless their text says otherwise.
              type: text
          - - text: The manifested force visibly originates from the gesturing hand.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "Manifested Strike in Melee: Manifested Strike is a ranged attack. If a hostile creature that can see you and is not Incapacitated is within 5 feet of you, you have Disadvantage on the attack roll. Phase Step, Disengage, movement, a weapon attack, or another effect can remove that pressure only as its own rules allow."
            type: text
        type: paragraph
      - inlines:
          - text: "Sneak Attack: Manifested Strike qualifies for the Rogue’s Sneak Attack feature as an attack made with a ranged weapon, provided all other Sneak Attack requirements are met. Sneak Attack damage dice double normally on a critical hit because they are not rider dice."
            type: text
        type: paragraph
      - inlines:
          - text: "The Holdout Option — Force Damage: When you declare a Manifested Strike, you can have it deal force damage instead of your Discipline’s damage type. The strike then deals half damage, rounded down."
            type: text
        type: paragraph
      - items:
          - - text: Declare this option before the attack roll.
              type: text
          - - text: If the attack has a rider, declare the option at the same time as that rider and its tier.
              type: text
        style: ordered
        type: list
      - items:
          - - text: "Riders are unchanged: Discipline riders use the Discipline’s damage type unless stated otherwise, and Advanced Training riders use the type listed in their text."
              type: text
          - - text: Psychokinesis already deals force damage and gains no benefit from this option.
              type: text
        style: unordered
        type: list
    id: common_manifested_strike
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Manifested Strike
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: A Signature Rider is the 3rd-level rider granted by your Discipline.
            type: text
        type: paragraph
      - items:
          - - text: "Pyrokinesis: Ember Bolt"
              type: text
          - - text: "Cryokinesis: Glacial Spike"
              type: text
          - - text: "Psychokinesis: Telekinetic Shove"
              type: text
          - - text: "Electrokinesis: Static Discharge"
              type: text
        style: unordered
        type: list
      - inlines:
          - text: Your Signature Rider’s Psi cost remains 0 at every tier. You can declare it repeatedly for any number of your Manifested Strike attacks.
            type: text
        type: paragraph
      - inlines:
          - text: The following limits still apply.
            type: text
        type: paragraph
      - items:
          - - text: A Manifested Strike hit can carry only one rider.
              type: text
          - - text: If you Overload your Signature Rider, pay the applicable Blood Tax.
              type: text
          - - text: Only one rider in each Attack action can be Tier 2.
              type: text
        style: unordered
        type: list
    id: common_signature_rider
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Signature Rider
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Kinetic Mastery gives your Manifested Strike the mastery property associated with your Discipline.
            type: text
        type: paragraph
      - items:
          - - text: "Pyrokinesis: Graze"
              type: text
          - - text: "Cryokinesis: Slow"
              type: text
          - - text: "Psychokinesis: Push"
              type: text
          - - text: "Electrokinesis: Sap"
              type: text
        style: unordered
        type: list
      - inlines:
          - text: Kinetic Mastery is separate from a rider and does not occupy the hit’s rider slot. Your Manifested Strike does not count against the number of weapons for which you can use Weapon Mastery.
            type: text
        type: paragraph
      - inlines:
          - text: "Pyrokinesis — Graze: If your Manifested Strike attack misses, the target takes damage equal to your Psionic Ability modifier of the strike’s damage type."
            type: text
        type: paragraph
      - inlines:
          - text: "Cryokinesis — Slow: If your Manifested Strike hits a creature and deals damage, you can reduce its Speed by 10 feet until the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "Psychokinesis — Push: If your Manifested Strike hits a Large or smaller creature, you can push it up to 10 feet straight away from you."
            type: text
        type: paragraph
      - inlines:
          - text: "Electrokinesis — Sap: If your Manifested Strike hits a creature, it has Disadvantage on its next attack roll before the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "Tactical Master: Beginning at Fighter level 9, when you make a Manifested Strike, you can use Tactical Master to replace its Kinetic Mastery property with Push, Sap, or Slow for that attack. The chosen property replaces Kinetic Mastery rather than stacking with it."
            type: text
        type: paragraph
      - inlines:
          - text: "Graze and the Holdout Option: Graze follows the strike’s damage type and reduction. With the Holdout Option, Graze deals force damage equal to half your Psionic Ability modifier, rounded down."
            type: text
        type: paragraph
      - inlines:
          - text: "Slow and Glacial Spike: Slow and Glacial Spike are separate Speed reductions and stack with each other. If both apply, the target’s Speed is reduced by 20 feet until the start of your next turn. After Slow ends, Glacial Spike’s remaining 10-foot reduction continues until the end of that turn. Neither effect stacks with additional applications of itself."
            type: text
        type: paragraph
      - inlines:
          - text: "Telekinetic Shove and Push: Declaring Telekinetic Shove replaces Push for that hit. Resolve only Telekinetic Shove’s direction and distance. Because the replacement occurs on declaration, a successful saving throw leaves the target unmoved."
            type: text
        type: paragraph
      - inlines:
          - text: "Masteries and Damage Immunity: Sap and Push trigger on a hit, so damage immunity does not prevent them. Graze and Slow require damage; against an immune creature, they work only if the Holdout Option lets the strike deal force damage."
            type: text
        type: paragraph
    id: common_kinetic_mastery
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Kinetic Mastery
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "Passive: Your passive Insight (Wisdom) score increases by your Psionic Ability modifier. If your table does not track passive Insight, calculate it as 10 + your Wisdom modifier + your Proficiency Bonus if proficient, then add your Psionic Ability modifier from this feature."
            type: text
        type: paragraph
      - inlines:
          - text: "Active Scan: As a bonus action, you project an instantaneous telepathic pulse."
            type: text
        type: paragraph
      - items:
          - - text: "Detection: "
              type: strong
            - text: You sense the number and direction of creatures within range that harbor hostile intent toward you or a creature you regard as an ally, provided each creature has a discernible mind and emotions you can read.
              type: text
          - - text: "Snapshot: "
              type: strong
            - text: The scan does not update after activation.
              type: text
          - - text: "Information excluded: "
              type: strong
            - text: The scan does not reveal identity, exact location, thoughts, motive, or intended action.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: You can use Active Scan a number of times equal to half your Proficiency Bonus, rounded down. You regain all expended uses when you finish a Short or Long Rest. Active Scan is a standalone feature; if Overloaded, you pay Blood Tax when you activate it.
            type: text
        type: paragraph
      - inlines:
          - text: "T0 Base: 15-foot range."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: Range increases to 30 feet."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: Range increases to 60 feet."
            type: text
        type: paragraph
    id: common_empathic_sense
    kind: feature
    level: 7
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Empathic Sense
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "Gain proficiency in one of the following skills of your choice: Arcana, Insight, Intimidation, Investigation, Perception, or Persuasion. Add your Psionic Ability modifier to ability checks you make with the chosen skill."
            type: text
        type: paragraph
    id: common_vanguard_training
    kind: feature
    level: 7
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Vanguard Training
  - classifications:
      entity_kind: system
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Deflection Screen · 5th Level · 1 Psi · Reaction
            type: text
        type: paragraph
      - inlines:
          - text: At 5th level, you gain Deflection Screen.
            type: text
        type: paragraph
      - inlines:
          - text: Phase Step · 10th Level · 1 Psi · Bonus Action
            type: text
        type: paragraph
      - inlines:
          - text: At 10th level, you gain Phase Step.
            type: text
        type: paragraph
      - inlines:
          - text: Advanced Training III · 15th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: Choose one feature from the Advanced Training pool.
            type: text
        type: paragraph
      - inlines:
          - text: Advanced Training IV · 18th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: Choose a second feature from the Advanced Training pool. You cannot choose the same feature twice.
            type: text
        type: paragraph
      - inlines:
          - text: Psionic Apex · 18th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: "Overload Mastery: Once per Short or Long Rest, when you declare your first Overload of a turn, you can activate this feature before paying Blood Tax. Until the end of that turn, including during any additional Attack action from Action Surge, halve the Blood Tax you pay after applying Resistance or any other reduction, rounding down. Overload Mastery can reduce Blood Tax below its normal minimum, but never below 1 damage for an individual Overload."
            type: text
        type: paragraph
      - inlines:
          - text: Advanced Training V · 20th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: Choose a third feature from the Advanced Training pool. You cannot choose the same feature more than once.
            type: text
        type: paragraph
      - inlines:
          - text: "Swapping Advanced Training: Whenever you gain a Fighter level, you can replace one feature chosen through Advanced Training III, IV, or V with another feature from the pool for which you qualify. This replacement costs no Psi."
            type: text
        type: paragraph
    id: advanced_training_progression
    kind: system
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    progression_section: reference
    publishable: true
    title: Advanced Training Progression
  - activation: on_hit
    classifications:
      entity_kind: feature
      feature_role: rider
      rules_area:
        - cryokinesis
    content:
      - inlines:
          - text: "T0 Base: The struck target takes 2 cold damage. This damage is fixed and does not scale. Its Speed is reduced by 10 feet until the end of your next turn. This reduction does not stack with itself."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The struck target must make a Constitution saving throw. On a failed save, its Speed becomes 0 until the end of your next turn, replacing the Tier 0 Speed reduction. On a successful save, the Tier 0 Speed reduction remains."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: On a failed save, the struck target is Restrained until the end of your next turn. This replaces Tier 1’s effect that makes its Speed 0 for that duration. On a successful save, the Tier 0 Speed reduction remains."
            type: text
        type: paragraph
    id: glacial_spike
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: cryokinesis
    psi_cost: 0
    publishable: true
    title: Glacial Spike
  - activation: on_hit
    classifications:
      entity_kind: feature
      feature_role: rider
      rules_area:
        - cryokinesis
    content:
      - inlines:
          - text: "T0 Base: The target’s speed becomes 0 until the end of your next turn (no save). The target must then make a Constitution saving throw; on a failed save, it is also Restrained until the end of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: On a failed save, the target also cannot take reactions until the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: On a failed save, the Stunned condition until the end of your next turn replaces the Restrained condition retained by Tier 1."
            type: text
        type: paragraph
    id: snow_chains
    kind: feature
    level: 7
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: cryokinesis
    psi_cost: 2
    publishable: true
    title: Snow Chains
  - activation: action
    classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - cryokinesis
    content:
      - body:
          - items:
              - - text: "Area: "
                  type: strong
                - text: Create a 15-foot-radius, 20-foot-high Cylinder of icy difficult terrain centered on a point within 60 feet.
                  type: text
              - - text: "Concentration: "
                  type: strong
                - text: This effect requires Concentration for up to 1 minute.
                  type: text
              - - text: "Trigger and saving throw: "
                  type: strong
                - text: When a creature enters the Cylinder for the first time on a turn or starts its turn there, it must make a Constitution saving throw.
                  type: text
              - - text: "Failed save: "
                  type: strong
                - text: On a failed save, its Speed becomes 0 until the end of the current turn.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Base
            type: text
        tier: 0
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 0:"
                type: text
            type: paragraph
          - inlines:
              - text: Expand the radius to 25 feet.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
