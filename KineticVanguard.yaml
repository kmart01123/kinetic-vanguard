  - activation: on_hit
    classifications:
      entity_kind: feature
      feature_role: rider
      rules_area:
        - psychokinesis
    content:
      - inlines:
          - source_unit_id: u_l0443_c001_paragraph_6999691e0f
            text: "T0 Base: Release a telekinetic shockwave in a 15-ft-radius Sphere centered on the target. You choose Explosion (outward) or Implosion (inward) when you activate. Each creature in the Sphere, including the struck target, must make a Strength saving throw. On a failed save, a creature is Restrained until the end of your next turn; each creature other than the struck target that fails is also pushed 15 ft away from or pulled 15 ft toward the target, matching your choice. The struck target is never moved by this effect. Because the struck target is the Sphere's center, it has no inward or outward line of movement; that movement is geometrically impossible under Rider Target Parity, not an exception to its saving throw, Restrained condition, or Tier 2 damage. On a successful save, a creature is neither moved nor Restrained. Creatures cannot be moved into occupied spaces. Resolve the creatures’ movement in an order you choose. A creature whose path is fully blocked stops in the nearest unoccupied space along its line of movement."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0445_c001_paragraph_d49fcb1b0e
            text: "T1 Overload: Changes from Tier 0: The Sphere’s radius increases to 20 ft, and the push or pull distance increases to 30 ft."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0447_c001_paragraph_9e1da508bd
            text: "T2 Overload: Changes from Tier 1: Creatures that fail the save also take force damage equal to your Psionic Ability modifier from the impact."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0449_c001_paragraph_98c461ab48
            text: Use Telekinetic Shove on another hit to position the primary target, then Explosion to scatter a cluster or Implosion to collapse it inward.
            type: text
        type: paragraph
