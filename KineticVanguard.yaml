          - source_unit_id: u_l0160_c001_paragraph_4a8d58aa96
            text: Each Discipline has one signature saving throw, used by any feature that calls for your “signature save” (such as Improved Phase Step). Pyrokinesis uses Dexterity, Cryokinesis uses Constitution, Psychokinesis uses Strength, and Electrokinesis uses Charisma. This is the saving throw the target makes against those features; it does not change any save another feature already specifies.
