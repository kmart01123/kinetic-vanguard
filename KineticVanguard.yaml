  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - source_unit_id: u_l0210_c001_paragraph_cfd2f38a95
            text: Your Manifested Strike has a mastery property determined by your Discipline. You can use that property, and it does not count against the number of weapons you can have mastery with from your Weapon Mastery feature.
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0212_c001_paragraph_d3c695afc3
            text: "Tactical Master: Beginning at Fighter level 9, when you make a Manifested Strike, you can use Tactical Master to replace its Kinetic Mastery property with Push, Sap, or Slow for that attack. The chosen property replaces Kinetic Mastery for that attack rather than stacking with it."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0214_c001_paragraph_437f537897
            text: "Pyrokinesis — Graze: If your Manifested Strike attack roll misses, the target still takes damage equal to your Psionic Ability modifier, of your Manifested Strike’s damage type."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0216_c001_paragraph_e49a42d1dc
            text: "Cryokinesis — Slow: If you hit a creature and deal damage to it, you can reduce its Speed by 10 feet until the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0218_c001_paragraph_8b903219b9
            text: "Psychokinesis — Push: If you hit a creature that is Large or smaller, you can push it up to 10 feet straight away from you. If you also apply Telekinetic Shove on that hit, Telekinetic Shove replaces this movement (you move the target once, not twice)."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0220_c001_paragraph_601a6909af
            text: "Electrokinesis — Sap: If you hit a creature, it has disadvantage on its next attack roll before the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0222_c001_paragraph_e3c3935b58
            text: "Graze and the Holdout Option: Graze deals Manifested Strike damage, so it follows the strike. If you declare the Holdout Option, Graze deals force damage equal to half your Psionic Ability modifier (rounded down), exactly as the strike itself is halved."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0224_c001_paragraph_e28bcdcfb1
            text: Masteries coexist with your riders. Slow adds to Glacial Spike. On a hit where you apply Telekinetic Shove, Shove replaces the Push mastery’s movement — you move the target once, using Shove’s direction and distance. The replacement happens when you declare Shove, not when it lands, so a successful save leaves you with neither movement. Your mastery remains free and automatic; a Signature Rider also costs no Psi but occupies the hit’s one rider slot.
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0226_c001_paragraph_28b95ebec2
            text: "Slow + Glacial Spike timing: Slow and Glacial Spike are separate Speed reductions and stack with each other. A target affected by both is reduced by 20 feet until the start of your next turn; when Slow expires, Glacial Spike’s remaining 10-foot reduction continues until the end of that turn. Neither effect stacks with additional applications of itself."
            type: text
        type: paragraph
      - inlines:
          - source_unit_id: u_l0228_c001_paragraph_05ae79fd07
            text: "Masteries and Damage Immunity: Sap and Push trigger on a hit, so damage immunity does not prevent them. Graze and Slow require damage; against an immune creature, they work only if the Holdout Option allows the strike to deal force damage."
            type: text
        type: paragraph
