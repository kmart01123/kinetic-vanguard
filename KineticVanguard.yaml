    title: Manifested Strike
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - source_unit_id: u_l0206_c001_paragraph_f1ddd895ea
            text: Your Discipline’s 3rd-level rider costs 0 Psi on every use, at every tier. You can apply it to any number of your Manifested Strike hits, subject to the normal limit of one rider per hit. You can Overload it normally without spending Psi, but you still pay its Blood Tax on declaration. Only one rider in each Attack action can be Overloaded to Tier 2. The four Signature Riders are Ember Bolt, Glacial Spike, Telekinetic Shove, and Static Discharge.
            type: text
        type: paragraph
    id: common_signature_rider
    kind: feature
    level: 3
    origins:
