entities:
  - classifications:
      entity_kind: system
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Resolve attacks one at a time. A rider is an on-hit feature that you can declare for a Manifested Strike.
            type: text
        type: paragraph
      - items:
          - - text: Choose the target.
              type: text
          - - text: Immediately before the attack roll, declare no rider or one legal rider.
              type: text
          - - text: If you use a rider, choose Tier 0 or an available Overload tier. Whether or not you use a rider, choose any damage-type option for the attack.
              type: text
          - - text: Pay the declared Psi and Blood Tax.
              type: text
          - - text: Roll and fully resolve the attack.
              type: text
          - - text: On a miss, any declared rider does not resolve, but the declared Psi and Blood Tax remain spent.
              type: text
        style: ordered
        type: list
      - items:
          - - text: Your Signature Rider costs no Psi and can be used repeatedly.
              type: text
          - - text: Other riders cost their listed Psi, and each can be used once per Attack action.
              type: text
          - - text: Each Manifested Strike can carry only one rider.
              type: text
          - - text: Only one rider can be Tier 2 in each Attack action.
              type: text
          - - text: Manifested Strike itself is never Overloaded.
              type: text
        style: unordered
        type: list
      - items:
          - - text: "Feature classification: "
              type: strong
            - text: Passive and triggered features are not riders unless their text says otherwise.
              type: text
          - - text: "Advanced Training riders: "
              type: strong
            - text: Advanced Training riders include Mind Shred and Mind Lock.
              type: text
          - - text: "Rider exclusivity: "
              type: strong
            - text: A Manifested Strike can carry either one Discipline rider or one Advanced Training rider, never both.
              type: text
          - - text: "Manifested Strike dice: "
              type: strong
            - text: A rider that uses Manifested Strike dice always uses the base die for your Fighter level.
              type: text
        style: unordered
        type: list
      - items:
          - - text: "Attack order: "
              type: strong
            - text: You can mix weapon attacks and Manifested Strikes in any order within the Attack action.
              type: text
          - - text: "Next attack: "
              type: strong
            - text: After each attack resolves, you can choose a different target, rider, Overload tier, or damage-type option for the next attack.
              type: text
          - - text: "Spent limits: "
              type: strong
            - text: A per-Attack-action limit remains spent once used.
              type: text
          - - text: "Action Surge: "
              type: strong
            - text: Action Surge creates a new Attack action and refreshes those limits, including the limit of one Tier 2 rider per Attack action.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "Rider Target Parity: When a rider creates a chain, arc, burst, Sphere, or other multi-creature effect centered on or originating from the creature struck by Manifested Strike, the struck creature is included among the affected creatures unless the effect’s geometry makes a particular movement impossible. Every affected creature otherwise resolves the same rider damage, saving throw, conditions, and applicable effects."
            type: text
        type: paragraph
      - items:
          - - text: "Standalone Action limit: "
              type: strong
            - text: You can activate only one standalone psionic feature that requires an Action on each of your turns.
              type: text
          - - text: "Action Surge: "
              type: strong
            - text: Action Surge can grant another Attack action, but it cannot be used to activate a second standalone psionic Action feature.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: Unless a feature says otherwise, damage from a hit resolves before any saving throw imposed by a rider on that hit.
            type: text
        type: paragraph
      - inlines:
          - text: "Short Disruption Timing:"
            type: text
        type: paragraph
      - items:
          - - text: "Reaction denial and attack-roll Disadvantage: "
              type: strong
            - text: Unless a feature says otherwise, reaction denial and attack-roll disadvantage imposed by an instantaneous Kinetic Vanguard feature last until the start of your next turn.
              type: text
          - - text: "Conditions: "
              type: strong
            - text: Conditions use the duration stated by the feature.
              type: text
          - - text: "Zones and recurring saves: "
              type: strong
            - text: Zones and recurring-save effects use their own timing.
              type: text
        style: unordered
        type: list
      - inlines:
          - text: At Fighter level 3, choose one Kinetic Discipline; this choice is permanent. Your chosen Discipline grants five features across the subclass progression. Deflection Screen at 5th level and Phase Step at 10th level are universal psionic tools. Advanced Training III, IV, and V at 15th, 18th, and 20th levels grant three choices from the Advanced Training pool regardless of Discipline.
            type: text
        type: paragraph
