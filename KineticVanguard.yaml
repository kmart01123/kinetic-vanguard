        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: The duration increases to 10 minutes. While Barrier is active and you are not in Initiative, you can spend 1 Psi to replace one chosen effect with another effect from the list. If Elemental Shroud is active, you can instead change its damage type. You cannot choose an effect that is already active."
            type: text
        type: paragraph
    id: advanced_barrier
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    title: Barrier
  - activation: bonus_action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: Teleport up to 30 feet to an unoccupied space you can see. Choose either the space you left or the space where you appear as the origin of a 5-foot-radius Sphere. Choose up to three other creatures in the Sphere. Each chosen creature must make your Discipline’s signature saving throw against your Psionic save DC, taking 2d10 damage of your Manifested Strike’s damage type on a failed save or half as much on a successful one. This movement does not provoke Opportunity Attacks, and you are unaffected by the burst."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The teleport range increases to 60 feet, and the burst damage increases to 3d10."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: The burst damage increases to 4d10. A creature that fails the saving throw also cannot take reactions until the start of your next turn."
            type: text
        type: paragraph
    id: advanced_improved_phase_step
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    title: Improved Phase Step
  - activation: passive
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: passive
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "Prerequisite: Psionic Apex. You gain one additional use of Overload Mastery per Short or Long Rest, for a total of two uses per Short or Long Rest."
            type: text
        type: paragraph
    id: advanced_overload_mastery_ii
    kind: feature
    level: 18
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    publishable: true
    title: Overload Mastery II
  - activation: passive
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: passive
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: Your maximum Psi Point pool increases by 4. You cannot choose this feature more than once.
            type: text
        type: paragraph
    id: advanced_inner_reserve
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    publishable: true
    title: Inner Reserve
