entities:
  - classifications:
      entity_kind: system
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "On your turn, when you attack with Manifested Strike, you can attach one rider to each hit. Your Discipline’s 3rd-level rider is your Signature Rider: it costs 0 Psi at every tier and can be used on any number of Manifested Strike hits. Other riders cost their listed Psi and can each be used once per Attack action."
            type: text
        type: paragraph
      - inlines:
          - text: Resolve attacks one at a time. Immediately before each attack roll, choose the target and declare the attack’s complete package, including its rider, Overload tier, and any damage-type option. Pay all Psi and Blood Tax when you make that declaration, then roll and fully resolve the attack before declaring the next one. A hit resolves the declared package. On a miss, the rider does not resolve, but its Psi and Blood Tax remain spent. Manifested Strike itself is never Overloaded.
            type: text
        type: paragraph
      - inlines:
          - text: You can mix weapon attacks and Manifested Strikes in any order within the Attack action, and later attacks can use different targets and legal packages based on the battlefield after earlier attacks resolve. Per-Attack-action limits remain spent once used. Action Surge creates a new Attack action and refreshes those limits, including the limit of one Tier 2 rider per Attack action.
            type: text
        type: paragraph
      - inlines:
          - text: A rider is an on-hit feature declared as part of a Manifested Strike. Passive and triggered features are not riders unless their text says otherwise. Advanced Training riders include Mind Shred and Mind Lock. A hit can carry either one Discipline rider or one Advanced Training rider, never both. A rider that uses Manifested Strike dice always uses the base die for your Fighter level.
            type: text
        type: paragraph
      - inlines:
          - text: "Rider Target Parity: When a rider creates a chain, arc, burst, Sphere, or other multi-creature effect centered on or originating from the creature struck by Manifested Strike, the struck creature is included among the affected creatures unless the effect’s geometry makes a particular movement impossible. Every affected creature otherwise resolves the same rider damage, saving throw, conditions, and applicable effects."
            type: text
        type: paragraph
      - inlines:
          - text: You can activate only one standalone psionic feature that requires an Action on each of your turns. Action Surge can grant another Attack action, but it cannot be used to activate a second standalone psionic Action feature. Unless a feature says otherwise, damage from a hit resolves before any saving throw imposed by a rider on that hit.
            type: text
        type: paragraph
      - inlines:
          - text: "Short Disruption Timing: Unless a feature says otherwise, reaction denial and attack-roll disadvantage imposed by an instantaneous Kinetic Vanguard feature last until the start of your next turn. Conditions use the duration stated by the feature. Zones and recurring-save effects use their own timing."
            type: text
        type: paragraph
      - inlines:
          - text: Your Discipline grants five features across the subclass progression. Deflection Screen at 5th level and Phase Step at 10th level are universal psionic tools. Advanced Training III, IV, and V at 15th, 18th, and 20th levels grant three choices from the Advanced Training pool regardless of Discipline.
            type: text
        type: paragraph
    id: how_to_play
    kind: system
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    progression_section: foundation
    publishable: true
    title: How to Play This Subclass
  - classifications:
      entity_kind: system
      rules_area:
        - common_features
    content:
      - activation:
          - text: The fighter takes the Attack action and targets the creature three times. Attack 1 is a Manifested Strike with Ember Bolt at Tier 2 for 0 Psi and 8 Blood Tax (2 × PB), paid before the roll. Attack 2 is a Manifested Strike with Cinder Lance at Tier 0 for 3 Psi and no Blood Tax. Attack 3 is a Manifested Strike with Ember Bolt at Tier 0 for 0 Psi and no Blood Tax. Every declared cost remains spent on a miss.
            type: text
        damage:
          - text: Attack 1 rolls 8 on its 1d10, dealing 8 + 4 + 6 from Ember Bolt Tier 2 = 18 fire damage. Attack 2 rolls 6 for the strike and 7 and 4 for Cinder Lance’s two additional base Manifested Strike dice, dealing 6 + 7 + 4 + 4 = 21 fire damage. Attack 3 rolls 5, dealing 5 + 4 + 2 from Ember Bolt Tier 0 = 11 fire damage. The creature takes 18 + 21 + 11 = 50 fire damage in total.
            type: text
        discipline: pyrokinesis
        effects:
          - text: These rider tiers add focused damage only. They cause no forced movement, Speed change, condition, or area effect.
            type: text
        heading:
          - text: Pyrokinesis
            type: text
        result:
          - text: The fighter ends 40 feet from the creature with 7 of 10 Psi, 8 hit points lost to Blood Tax, and no concentration, bonus action, reaction, or movement used. The creature has taken 50 fire damage.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Cha, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 13 + 10 = 23, and 7 + 10 = 17; all three hit AC 16. These Ember Bolt and Cinder Lance tiers require no saving throws.
            type: text
        setup:
          - text: A level 11 Pyrokinesis fighter begins 40 feet from one hostile creature with AC 16 and no fire resistance or immunity. The fighter has three attacks, one free hand, 10 Psi, PB +4, Cha +4, a 1d10 Manifested Strike die, and enough hit points for Blood Tax.
            type: text
        title:
          - text: Focused Fire — Level 11 Pyrokinesis
            type: text
        type: example_play_section
      - activation:
          - text: As a bonus action, the fighter activates standalone Vectored Thrust at Tier 1, spends 2 Psi, takes 4 Blood Tax (1 × PB), and begins concentrating for up to 10 minutes. The startup Blood Tax requires no concentration check. The fighter uses the 30-foot fly speed to move 30 feet from the creature without provoking opportunity attacks, then takes the Attack action. Attack 1 adds Telekinetic Shove at Tier 0 for 0 Psi; attacks 2 and 3 are plain Manifested Strikes.
            type: text
        damage:
          - text: Attack 1 rolls 7 on its 1d10, dealing 7 + 4 Int + 2 from Telekinetic Shove = 13 force damage. Attack 2 rolls 6, dealing 6 + 4 = 10 force damage. Attack 3 rolls 4, dealing 4 + 4 = 8 force damage. The creature takes 13 + 10 + 8 = 31 force damage in total.
            type: text
        discipline: psychokinesis
        effects:
          - text: The failed Strength saving throw lets the fighter push the creature 10 feet horizontally in a chosen direction. Vectored Thrust remains active through concentration, and the flight provokes no opportunity attacks.
            type: text
        heading:
          - text: Psychokinesis
            type: text
        result:
          - text: The fighter ends flying 30 feet from the creature’s starting position with 8 of 10 Psi, 4 hit points lost to Blood Tax, and concentration on Vectored Thrust. The creature has taken 31 force damage and ends 10 feet from its starting position. The bonus action, movement, and all three attacks are used; no reaction is used.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Int, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 12 + 10 = 22, and 7 + 10 = 17; all three hit AC 16. After attack 1 deals damage, the creature rolls 12 against save DC 16 (8 + 4 + 4) and fails its Strength saving throw.
            type: text
        setup:
          - text: A level 11 Psychokinesis fighter begins within 5 feet of one hostile creature with AC 16. The fighter has three attacks, one free hand, 10 Psi, PB +4, Int +4, a 1d10 Manifested Strike die, enough hit points for Blood Tax, and an open concentration slot.
            type: text
        title:
          - text: Aerial Repositioning — Level 11 Psychokinesis
            type: text
        type: example_play_section
      - activation:
          - text: The fighter remains in place and takes the Attack action. Attack 1 is a Manifested Strike with Glacial Spike at Tier 0 for 0 Psi and no Blood Tax. Attack 2 is a Manifested Strike with Glacial Spike at Tier 1 for 0 Psi and 4 Blood Tax (1 × PB), paid before the roll and retained on a miss. Attack 3 is a plain Manifested Strike. No bonus action or reaction is used.
            type: text
        damage:
          - text: Attack 1 rolls 6 on its 1d10, dealing 6 + 4 Int + 2 from Glacial Spike = 12 cold damage. Attack 2 rolls 8, dealing 8 + 4 + 2 = 14 cold damage. Attack 3 rolls 5, dealing 5 + 4 = 9 cold damage. The creature takes 12 + 14 + 9 = 35 cold damage in total.
            type: text
        discipline: cryokinesis
        effects:
          - text: Attack 1 reduces the creature’s Speed by 10 feet. Attack 2’s failed Constitution saving throw makes its Speed 0 until the end of the fighter’s next turn, replacing that reduction. Frozen Ground remains difficult terrain; when the creature starts its next turn in the Cylinder, it makes Frozen Ground’s separate Constitution saving throw.
            type: text
        heading:
          - text: Cryokinesis
            type: text
        result:
          - text: The fighter ends 20 feet from the creature with 8 Psi, 4 hit points lost to Blood Tax, and concentration on Frozen Ground. The creature has taken 35 cold damage and has Speed 0 in difficult terrain until the end of the fighter’s next turn. No Psi, bonus action, reaction, or movement is used this turn.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Int, +4 PB, +2 Psionic Focus). The attacks roll 10 + 10 = 20, 8 + 10 = 18, and 12 + 10 = 22; all three hit AC 16. After attack 2 deals damage, the creature rolls 11 against save DC 16 (8 + 4 + 4) and fails its Constitution saving throw.
            type: text
        setup:
          - text: A level 11 Cryokinesis fighter begins 20 feet from one hostile creature with AC 16 inside the 15-foot-radius Frozen Ground Cylinder. The fighter has three attacks, one free hand, PB +4, Int +4, a 1d10 Manifested Strike die, 8 Psi remaining after activating Frozen Ground last turn for 2 Psi, enough hit points for Blood Tax, and concentration on the difficult-terrain area.
            type: text
        title:
          - text: Frozen Ground Lockdown — Level 11 Cryokinesis
            type: text
        type: example_play_section
      - activation:
          - text: The fighter takes the Attack action and resolves each attack before choosing the next target. Attack 1 declares a Manifested Strike with the Static Discharge Signature Rider at Tier 2 for 0 Psi and pays 8 Blood Tax (2 × PB) before the roll. Attack 2 declares Branching Bolt at Tier 0 for 2 Psi. Attack 3 declares Electron Burst at Tier 0 for 2 Psi. The Psi and Blood Tax remain spent if the associated attack misses.
            type: text
        damage:
          - text: Attack 1 rolls 7 on its 1d10, dealing 7 + 4 = 11 lightning damage to the first primary target; Static Discharge adds 2 damage to it and each of four secondary targets. Attack 2 rolls 6 for 10 strike damage, and Branching Bolt rolls 8 for the second primary target and one secondary target. Attack 3 rolls 5 for 9 strike damage, and Electron Burst rolls 6 + 5 = 11 damage against each failed save. Across the five creatures, the turn deals 111 lightning damage.
            type: text
        discipline: electrokinesis
        effects:
          - text: Only each struck primary target receives Sap. Static Discharge affects the first primary target and four nearby creatures; each fails its Charisma saving throw and loses reactions until the start of the fighter’s next turn. Branching Bolt damages its primary target and one chosen secondary target. Electron Burst damages all five creatures in its 10-foot-radius Sphere. Secondary targets are damaged but are not hit and do not receive Sap.
            type: text
        heading:
          - text: Electrokinesis
            type: text
        result:
          - text: The fighter ends in place with 6 Psi, 8 hit points lost to Blood Tax, and no concentration, bonus action, reaction, or movement used. The five creatures have taken 111 lightning damage in total; three primaries are struck and Sapped, and all five cannot take reactions until the start of the fighter’s next turn. Static Discharge is the only Tier 2 rider used, while Branching Bolt and Electron Burst are each used once.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Psionic Ability, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 12 + 10 = 22, and 7 + 10 = 17; all three hit AC 16. Each of the five Static Discharge targets rolls 12 against save DC 16 and fails its Charisma saving throw. Each of the five Electron Burst targets rolls 13 against DC 16 and fails its Charisma saving throw.
            type: text
        setup:
          - text: A level 11 Electrokinesis fighter faces five hostile creatures with AC 16 clustered so four are within 5 feet of the first primary target, a later secondary target is within 15 feet of the second primary target, and all five fit inside the final 10-foot-radius Sphere. The fighter has three attacks, 10 Psi, PB +4, a +4 Psionic Ability modifier, a 1d10 Manifested Strike die, and enough hit points for Blood Tax.
            type: text
        title:
          - text: Room Sweep — Level 11 Electrokinesis
            type: text
        type: example_play_section
    id: common_example_play
    kind: system
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    progression_section: foundation
    publishable: true
    title: Example Play
  - classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Declare that you are Overloading a rider or standalone feature when you declare that feature — for a rider, before the Manifested Strike attack roll. Manifested Strike itself can never be Overloaded and never generates Blood Tax.
            type: text
        type: paragraph
      - inlines:
          - text: "Overload is a deliberate escalation that trades hit points for power. It applies to riders and standalone psionic features, never to Manifested Strike itself. Two tiers exist, both gated by Fighter level. Overload tiers are cumulative: Tier 2 includes every effect of Tier 1 unless it explicitly replaces that effect. Each tier’s text states whether it adds to or replaces the lower tier’s effect."
            type: text
        type: paragraph
      - inlines:
          - text: The Blood Tax
            type: text
        kind: note
        type: note
      - body:
          - inlines:
              - text: (3rd level) You can Overload a rider or standalone feature to Tier 1. You take psychic damage equal to your Proficiency Bonus as Blood Tax when you declare the Overload, whether or not an associated attack hits.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: (10th level) You can Overload a rider or standalone feature to Tier 2. You take psychic damage equal to twice your Proficiency Bonus as Blood Tax when you declare the Overload. Within each Attack action, only one rider can be Tier 2. Action Surge creates a new Attack action and a new Tier 2 rider allowance. This limit does not restrict standalone features.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
      - body:
          - inlines:
              - text: "Before rolling, you declare: “Glacial Spike T2.”"
                type: emphasis
            type: paragraph
          - inlines:
              - text: "Your strike uses its level-set die: 1d10. The Tier 2 declaration is on Glacial Spike — the strike itself can never be Overloaded."
                type: text
            type: paragraph
          - inlines:
              - text: "Hit: Manifested Strike deals 1d10 + 3, and Glacial Spike adds 2 cold damage, for 1d10 + 5 total. On a failed Con save, the target is Restrained until the end of your next turn."
                type: text
            type: paragraph
          - inlines:
              - text: "Blood Tax: 1 × 2 × PB = 2 × 4 = 8, paid on declaration. Glacial Spike is a Signature Rider and costs 0 Psi; Tier 2 escalates its control."
                type: text
            type: paragraph
          - inlines:
              - text: "Miss: No effects; Blood Tax (8) is still paid — it was spent on declaration. Glacial Spike costs 0 Psi. Roll your next attack."
                type: text
            type: paragraph
        tier: 2
        title:
          - text: Example — Level 11 Cryokinesis (PB 4, Int +3)
            type: strong
        type: example
      - inlines:
          - text: Blood Tax is psychic damage. Resistance to psychic damage halves it normally. Immunity to psychic damage instead functions as Resistance against Blood Tax. Regardless of the source of reduction, you take at least half the declared Blood Tax, rounded down, unless Overload Mastery specifically says otherwise.
            type: text
        kind: note
        type: note
      - inlines:
          - text: Attack Declaration Costs
            type: text
        type: paragraph
      - headers:
          - - text: Declaration
              type: text
          - - text: Psi
              type: text
          - - text: Blood Tax
              type: text
          - - text: Notes
              type: text
        rows:
          - - - text: Manifested Strike (no rider)
                type: text
            - - text: "0"
                type: text
            - - text: None
                type: text
            - - text: Always available
                type: text
          - - - text: Manifested Strike + Tier 0 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: None
                type: text
            - - text: Signature Rider is unlimited; other riders are once per Attack action
                type: text
          - - - text: Manifested Strike + Tier 1 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: PB
                type: text
            - - text: Paid on declaration, hit or miss
                type: text
          - - - text: Manifested Strike + Tier 2 rider
                type: text
            - - text: Listed cost (0 for Signature Rider)
                type: text
            - - text: 2 × PB
                type: text
            - - text: Only one Tier 2 rider per Attack action
                type: text
          - - - text: Overloaded standalone feature
                type: text
            - - text: Feature cost
                type: text
            - - text: PB or 2 × PB
                type: text
            - - text: Paid when activated
                type: text
          - - - text: Overloaded rider + overloaded standalone feature
                type: text
            - - text: Rider cost + feature cost
                type: text
            - - text: Sum both
                type: text
            - - text: Each Overload pays separately
                type: text
        type: table
      - inlines:
          - text: "Using Overload: For a rider, declare the rider and its tier before the attack roll. A hit resolves the declared package; a miss does not resolve the rider, but Psi and Blood Tax remain spent. Standalone features are declared and paid for when activated. If you Overload more than one feature in the same turn, pay Blood Tax separately for each Overload. Effects that explicitly trigger on a miss, such as Graze, still resolve."
            type: text
        type: paragraph
      - inlines:
          - text: "Critical Hits and Riders: On a critical hit with Manifested Strike, double only the Manifested Strike damage dice. Damage dice dealt by a rider are never doubled, regardless of which creatures the rider damages. Flat damage, saving throws, conditions, forced movement, and other rider effects resolve normally. Standalone features are unaffected by this rule."
            type: text
        type: paragraph
      - inlines:
          - text: "Damage Immunity and Riders: Discipline riders deal your Discipline’s damage type unless stated otherwise. Advanced Training riders deal the damage type listed in their text. Damage immunity prevents only matching damage; it does not prevent the rider’s saving throw or other effects. For example, a cold-immune creature can still be Restrained by Snow Chains, and a fire-immune creature can still be Blinded by Flare."
            type: text
        type: paragraph
      - inlines:
          - text: "Concentration Startup Exception: The Blood Tax from the activation that starts a concentration feature does not trigger a concentration check. Only subsequent Blood Tax and other damage sources require checks as normal. Standard concentration rules still apply — you can only concentrate on one feature at a time."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Blood Tax and Temporary Hit Points: Blood Tax bypasses Temporary Hit Points and is deducted directly from your current Hit Points. Temporary Hit Points cannot absorb, reduce, or pay Blood Tax. Blood Tax remains psychic damage for Resistance, concentration checks, and effects that trigger when you take damage."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Blood Tax at 0 Hit Points: Blood Tax is paid before the declared attack or feature resolves. If it reduces you to 0 hit points, you fall Unconscious immediately and the declared attack or feature does not resolve. Any Psi spent and Blood Tax paid remain spent."
            type: text
        kind: note
        type: note
