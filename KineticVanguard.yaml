              - - text: "Conditions: "
                  type: strong
                - text: Three primary targets are struck and Sapped, and none of the five can take reactions until the start of your next turn.
                  type: text
              - - text: "Rider limits: "
                  type: strong
                - text: Static Discharge is the only Tier 2 rider used; Branching Bolt and Electron Burst are each used once.
                  type: text
            style: unordered
            type: list
        rolls_or_saves:
          - inlines:
              - text: Your attack bonus is +10 (+4 Psionic Ability, +4 Proficiency Bonus, +2 Psionic Focus).
                type: text
            type: paragraph
          - items:
              - - text: "Attack 1: "
                  type: strong
                - text: You roll 9 + 10 = 19 and hit Armor Class 16.
                  type: text
              - - text: "Attack 2: "
                  type: strong
                - text: You roll 12 + 10 = 22 and hit Armor Class 16.
                  type: text
              - - text: "Attack 3: "
                  type: strong
                - text: You roll 7 + 10 = 17 and hit Armor Class 16.
                  type: text
              - - text: "Static Discharge saves: "
                  type: strong
                - text: Each of the five Static Discharge targets rolls 12 against Difficulty Class 16 and fails its Charisma saving throw.
                  type: text
              - - text: "Electron Burst saves: "
                  type: strong
                - text: Each of the five Electron Burst targets rolls 13 against Difficulty Class 16 and fails its Charisma saving throw.
                  type: text
            style: ordered
            type: list
        setup:
          - items:
              - - text: "Opposition: "
                  type: strong
                - text: You are a level 11 Electrokinesis fighter facing five hostile creatures with Armor Class 16.
                  type: text
              - - text: "Primary targets: "
                  type: strong
                - text: The three intended primary targets are within 60 feet of you.
                  type: text
              - - text: "Clustering: "
                  type: strong
                - text: The creatures are clustered so four are within 5 feet of the first primary target, a later secondary target is within 15 feet of the second primary target, and all five fit inside the final 10-foot-radius Sphere.
                  type: text
              - - text: "Resources: "
                  type: strong
                - text: You have three attacks, one free hand, 10 Psi, Proficiency Bonus +4, a +4 Psionic Ability modifier, a 1d10 Manifested Strike die, and enough Hit Points to pay Blood Tax.
                  type: text
            style: unordered
            type: list
        title:
          - text: Room Sweep — Level 11 Electrokinesis
            type: text
