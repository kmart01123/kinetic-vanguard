    content:
      - inlines:
          - text: "T0 Base: You produce the effects of charm person (Concentration, up to 1 hour) without casting a spell. The target makes a Charisma saving throw against your Psionic save DC. This feature is exclusive — you choose one tier when you activate it. Higher tiers replace the effect entirely; they do not stack."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: Tier 1 replaces Tier 0’s charm person effect with the effects of suggestion (Concentration, up to 8 hours) without casting a spell. Charisma save against your Psionic save DC."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: Tier 2 replaces Tier 1’s suggestion effect with the effects of mass suggestion, affecting up to five creatures you can see within 60 feet (Concentration, up to 8 hours), without casting a spell. Each target makes a Charisma saving throw against your Psionic save DC."
            type: text
        type: paragraph
      - inlines:
          - text: "Beguile is a standalone Action — it does not require a Manifested Strike hit and is not a rider. All tiers require Concentration and consume your concentration slot. Beguile is not a spell: it requires no components, cannot be Counterspelled or dispelled, is unaffected by features that key off spellcasting (for example, a feature that triggers specifically from casting a spell), and its save is always Charisma regardless of your Discipline. It is escalating mental influence, not spellcasting."
            type: text
        type: paragraph
    id: advanced_beguile
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    requires_concentration: true
    title: Beguile
  - activation: on_hit
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: rider
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: The target is Blinded until the end of your next turn. There is no saving throw."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The target is Blinded as at Tier 0 and must make an Intelligence saving throw. On a failed save it is also Incapacitated until the end of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: The target is Blinded as at Tier 0 and must make an Intelligence saving throw. On a failed save, the Stunned condition until the end of your next turn replaces the Incapacitated condition from Tier 1."
            type: text
        type: paragraph
      - inlines:
          - text: Mind Lock is the Advanced Training pool’s dedicated control pick. Blinded is its reliable floor; Incapacitated and Stunned are the Overload payoff. Mind Shred is the damage choice, while Mind Lock is the control choice.
            type: text
        type: paragraph
    id: advanced_mind_lock
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    title: Mind Lock
  - activation: action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: Create a 15-ft-radius, 20-ft-high Cylinder of intensified gravity centered on a point within 60 ft. The area is difficult terrain for the duration. Any creature in the zone has its speed halved (no save). A flying creature that enters the zone or starts its turn there immediately falls to the ground, taking fall damage as normal, and cannot fly or gain a fly speed while it remains in the zone. A creature that enters the area for the first time on a turn or starts its turn there must make a Strength saving throw. On a failed save, it is unable to take reactions until the start of its next turn. On a successful save, it suffers no additional effect."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: Creatures in the Cylinder have disadvantage on attack rolls."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: A creature that fails the saving throw also has its Speed reduced to 0 until the start of its next turn."
            type: text
        type: paragraph
      - inlines:
          - text: Gravitic Press is a standalone Action — it does not require a Manifested Strike hit and is not a rider. Requires Concentration.
            type: text
        type: paragraph
    id: advanced_gravitic_press
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    requires_concentration: true
    title: Gravitic Press
  - activation: bonus_action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: For 1 minute, choose one of the following effects, which lasts for the duration. Blade Shield: you have resistance to bludgeoning, piercing, and slashing damage from weapon attacks. Elemental Shroud: choose one damage type from acid, cold, fire, lightning, or thunder; you have resistance to that damage type. Spellward: you have advantage on saving throws against spells. Steadfast Guard: you have advantage on Strength saving throws, and on ability checks and saving throws to resist being grappled, shoved, knocked prone, or forcibly moved. Mental Bulwark: you have advantage on saving throws against being charmed, frightened, blinded, restrained, incapacitated, paralyzed, or stunned."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: Tier 1 replaces Tier 0’s limit of one effect with two of the five effects."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: The duration increases to 10 minutes. While Barrier is active and you are not in Initiative, you may spend 1 Psi to replace one of your chosen effects with another effect from the list. If Elemental Shroud is active, you may instead change its chosen damage type. You cannot choose an effect you already have active."
            type: text
        type: paragraph
      - inlines:
          - text: Barrier is a standalone Bonus Action — not a rider.
            type: text
        type: paragraph
    id: advanced_barrier
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    title: Barrier
  - activation: bonus_action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: As a bonus action, teleport up to 30 feet to an unoccupied space you can see. Choose either the space you left or the space where you appear as the origin of a 5-foot-radius Sphere. Choose up to three other creatures in the Sphere. Each chosen creature must make your Discipline’s signature saving throw against your Psionic save DC, taking 2d10 damage of your Manifested Strike’s damage type on a failed save, or half as much on a successful one. This movement does not provoke opportunity attacks, and you are unaffected by the burst."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The teleport range increases to 60 feet and the burst damage increases to 3d10."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: The burst damage increases to 4d10. A creature that fails the save also cannot take reactions until the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: Improved Phase Step is a standalone Bonus Action — it is not a rider and does not require a Manifested Strike hit. Where Phase Step is a cheap utility blink, Improved Phase Step is the longer, costlier blink that detonates on either end of the jump.
            type: text
        type: paragraph
    id: advanced_improved_phase_step
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    title: Improved Phase Step
  - activation: passive
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: passive
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: You can choose this feature only if you have Psionic Apex. You gain one additional use of Overload Mastery per Short or Long Rest. This stacks with the use granted by Psionic Apex, giving you two total uses per Short or Long Rest.
            type: text
        type: paragraph
    id: advanced_overload_mastery_ii
    kind: feature
    level: 18
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    publishable: true
    title: Overload Mastery II
  - activation: passive
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: passive
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: Your maximum Psi point pool increases by 4. You cannot choose this feature more than once.
            type: text
        type: paragraph
    id: advanced_inner_reserve
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    publishable: true
    title: Inner Reserve
