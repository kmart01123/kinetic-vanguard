    id: common_psi_reservoir
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Psi Reservoir
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: You can communicate telepathically with one or more creatures you can see within 60 feet, provided you share a common language with each creature. When you address multiple creatures, each receives the same message. A recipient can reply telepathically to you, but recipients cannot communicate directly with one another through this feature. This communication does not grant mind reading.
            type: text
        type: paragraph
    id: common_psionic_link
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Psionic Link
  - activation: action
    classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "When you take the Attack action, you can replace any number of your weapon attacks with a Manifested Strike. A Manifested Strike is a special ranged psionic attack with a range of 60 feet, formed from psionic force. Your Discipline determines its damage type. Add your Psionic Ability modifier to Manifested Strike damage. Your Manifested Strike attack bonus is your Psionic Ability modifier + your Proficiency Bonus + your Psionic Focus bonus. Your Psionic Focus bonus is +1 at Fighter levels 3–8, +2 at levels 9–16, and +3 at levels 17–20. On a critical hit, double only the Manifested Strike's damage dice; rider damage dice never double. The damage die scales with Fighter level per the table in Section 01. For the purposes of feats, Fighting Styles, and other features that reference ranged weapons or attacks made with them, treat Manifested Strike as an attack made with a ranged weapon with which you are proficient. It is not a weapon, spell, or object for any other purpose. Manifested Strike is, however, a magical effect: creatures with Magic Resistance (or a similar trait) have advantage on saving throws forced by your riders, though the strike’s attack roll and damage are unaffected. Manifested Strike itself costs no Psi — you can always attack."
            type: text
        type: paragraph
      - inlines:
          - text: "Manifested Strike die by level: 1d6 (3rd–4th) → 1d8 (5th–10th) → 1d10 (11th–16th) → 1d12 (17th–20th)"
            type: text
        type: paragraph
      - headers:
          - - text: Fighter Level
              type: text
          - - text: MS Die
              type: text
        rows:
          - - - text: 3–4
                type: text
            - - text: 1d6
                type: text
          - - - text: 5–10
                type: text
            - - text: 1d8
                type: text
          - - - text: 11–16
                type: text
            - - text: 1d10
                type: text
          - - - text: 17–20
                type: text
            - - text: 1d12
                type: text
        type: table
      - inlines:
          - text: "Somatic Requirement: You project Manifested Strike from one of your hands. To make the attack, you must have the free use of that hand to perform the psionic gesture and release the strike. A hand is free for this purpose if it is not holding or manipulating a weapon, Shield, object, or creature. You can release one hand from a Two-Handed weapon, make the Manifested Strike, and re-grip the weapon before a later attack in the same Attack action; releasing or replacing a hand on a weapon you continue to hold requires no action and does not equip or unequip that weapon. Features delivered through Manifested Strike inherit this requirement unless their text says otherwise. The exact gesture is yours to describe, but the manifested force visibly originates from the gesturing hand. This is a psionic Somatic requirement; Manifested Strike remains a special psionic attack, not a spell."
            type: text
        type: paragraph
      - inlines:
          - text: "Sneak Attack: Manifested Strike qualifies for the Rogue’s Sneak Attack feature as an attack made with a ranged weapon, provided all other Sneak Attack requirements are met. Sneak Attack damage dice double normally on a critical hit; they are not rider dice."
            type: text
        type: paragraph
      - inlines:
          - text: "Magical Effects: For the purpose of Magic Resistance and similar effects, all Kinetic Vanguard features — Manifested Strike, every rider, and every standalone psionic feature — are magical effects. However, none is a spell and none is a Magic action: they cannot be Counterspelled, are unaffected by features that key off spellcasting, and Beguile in particular is a magical effect whose save is always Charisma but which is not a spell."
            type: text
        type: paragraph
      - inlines:
          - text: "Manifested Strike in Melee: Manifested Strike is a ranged attack. If a hostile creature that can see you and is not Incapacitated is within 5 feet of you, you have Disadvantage on the attack roll. Use Phase Step, Disengage, movement, a weapon attack, or another effect whose own text explicitly removes that ranged-attack pressure."
            type: text
        type: paragraph
      - inlines:
          - text: "The Holdout Option — Force Damage: When you declare a Manifested Strike, you may have it deal force damage instead of your Discipline’s damage type. The strike then deals half damage, rounded down. Declare this before the attack roll with the rest of the attack package. Riders are unchanged: Discipline riders use the Discipline’s damage type unless stated otherwise, and Advanced Training riders use the type specified in their text. The Holdout Option is useful against damage immunity, not Resistance. Psychokinesis already deals force damage and gains no benefit from it."
            type: text
        type: paragraph
      - inlines:
          - text: "Design Note — Attack Bonus: Psionic Focus mirrors the expected accuracy progression of magic weapons without making Manifested Strike an item."
            type: text
        kind: note
        type: note
      - inlines:
          - text: "Design Note — Melee Pressure: Manifested Strike follows the normal disadvantage rule for ranged attacks made while threatened. Because Psi and Blood Tax are committed before the roll, Overloading from a bad position is especially risky. Reposition rather than treating the subclass as a melee striker."
            type: text
        kind: note
        type: note
    id: common_manifested_strike
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Manifested Strike
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Your Discipline’s 3rd-level rider costs 0 Psi on every use, at every tier. You can apply it to any number of your Manifested Strike hits, subject to the normal limit of one rider per hit. You can Overload it normally without spending Psi, but you still pay its Blood Tax on declaration. Only one rider in each Attack action can be Overloaded to Tier 2. The four Signature Riders are Ember Bolt, Glacial Spike, Telekinetic Shove, and Static Discharge.
            type: text
        type: paragraph
    id: common_signature_rider
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Signature Rider
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: Your Manifested Strike has a mastery property determined by your Discipline. You can use that property, and it does not count against the number of weapons you can have mastery with from your Weapon Mastery feature.
            type: text
        type: paragraph
      - inlines:
          - text: "Tactical Master: Beginning at Fighter level 9, when you make a Manifested Strike, you can use Tactical Master to replace its Kinetic Mastery property with Push, Sap, or Slow for that attack. The chosen property replaces Kinetic Mastery for that attack rather than stacking with it."
            type: text
        type: paragraph
      - inlines:
          - text: "Pyrokinesis — Graze: If your Manifested Strike attack roll misses, the target still takes damage equal to your Psionic Ability modifier, of your Manifested Strike’s damage type."
            type: text
        type: paragraph
      - inlines:
          - text: "Cryokinesis — Slow: If you hit a creature and deal damage to it, you can reduce its Speed by 10 feet until the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "Psychokinesis — Push: If you hit a creature that is Large or smaller, you can push it up to 10 feet straight away from you. If you also apply Telekinetic Shove on that hit, Telekinetic Shove replaces this movement (you move the target once, not twice)."
            type: text
        type: paragraph
      - inlines:
          - text: "Electrokinesis — Sap: If you hit a creature, it has disadvantage on its next attack roll before the start of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "Graze and the Holdout Option: Graze deals Manifested Strike damage, so it follows the strike. If you declare the Holdout Option, Graze deals force damage equal to half your Psionic Ability modifier (rounded down), exactly as the strike itself is halved."
            type: text
        type: paragraph
      - inlines:
          - text: Masteries coexist with your riders. Slow adds to Glacial Spike. On a hit where you apply Telekinetic Shove, Shove replaces the Push mastery’s movement — you move the target once, using Shove’s direction and distance. The replacement happens when you declare Shove, not when it lands, so a successful save leaves you with neither movement. Your mastery remains free and automatic; a Signature Rider also costs no Psi but occupies the hit’s one rider slot.
            type: text
        type: paragraph
      - inlines:
          - text: "Slow + Glacial Spike timing: Slow and Glacial Spike are separate Speed reductions and stack with each other. A target affected by both is reduced by 20 feet until the start of your next turn; when Slow expires, Glacial Spike’s remaining 10-foot reduction continues until the end of that turn. Neither effect stacks with additional applications of itself."
            type: text
        type: paragraph
      - inlines:
          - text: "Masteries and Damage Immunity: Sap and Push trigger on a hit, so damage immunity does not prevent them. Graze and Slow require damage; against an immune creature, they work only if the Holdout Option allows the strike to deal force damage."
            type: text
        type: paragraph
    id: common_kinetic_mastery
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Kinetic Mastery
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "Passive: Your passive Insight (Wisdom) score increases by your Psionic Ability modifier. (If your table does not track a passive Insight score, treat it as 10 + your Wisdom modifier + your Proficiency Bonus if proficient, then add your Psionic Ability modifier from this feature.) Active Scan: As a bonus action, you project a momentary telepathic pulse. At the instant you activate it, you sense the number and direction of creatures within range that harbor hostile intent toward you or a creature you regard as an ally, provided each has a discernible mind and emotions you can read. The scan is instantaneous and does not update if a creature moves, enters or leaves the range, or its intent changes. It does not reveal identity, exact location, thoughts, motive, or intended action. This is a standalone feature; Blood Tax applies on activation if Overloaded. You can use the scan a number of times equal to half your Proficiency Bonus (rounded down), regaining all expended uses on a short or long rest. T0 Base: 15-foot range. T1 Overload: Changes from Tier 0: Range increases to 30 feet. T2 Overload: Changes from Tier 1: Range increases to 60 feet."
            type: text
        type: paragraph
    id: common_empathic_sense
    kind: feature
    level: 7
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Empathic Sense
  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "You gain proficiency in one of the following skills of your choice: Arcana, Insight, Intimidation, Investigation, Perception, or Persuasion. You also add your Psionic Ability modifier to checks using that skill."
            type: text
        type: paragraph
    id: common_vanguard_training
    kind: feature
    level: 7
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    publishable: true
    title: Vanguard Training
  - classifications:
      entity_kind: system
      rules_area:
        - common_features
    content:
      - inlines:
          - text: "Deflection Screen · 5th Level · 1 Psi · Reaction"
            type: text
        type: paragraph
      - inlines:
          - text: Your psionic instincts develop a reflexive shield. When you take damage, you may use your reaction and spend 1 Psi to reduce it by 3d8 + your Psionic Ability modifier. Deflection Screen can reduce only damage from a source other than yourself; it cannot reduce Blood Tax or any other damage this subclass inflicts on you.
            type: text
        type: paragraph
      - inlines:
          - text: "Phase Step · 10th Level · 1 Psi · Bonus Action"
            type: text
        type: paragraph
      - inlines:
          - text: Your psionic control extends to spatial displacement. Teleport up to 15 feet to an unoccupied space you can see. This movement does not provoke opportunity attacks.
            type: text
        type: paragraph
      - inlines:
          - text: Advanced Training III · 15th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: Your psionic mastery deepens. Choose one feature from the Advanced Training pool (Section 05).
            type: text
        type: paragraph
      - inlines:
          - text: "Swapping: You may replace your chosen feature whenever you gain a Fighter level. There is no Psi cost to swap."
            type: text
        type: paragraph
      - inlines:
          - text: Advanced Training IV · 18th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: Choose a second feature from the Advanced Training pool (Section 05). You cannot choose the same feature twice.
            type: text
        type: paragraph
      - inlines:
          - text: "Swapping: You may replace your chosen feature whenever you gain a Fighter level. There is no Psi cost to swap."
            type: text
        type: paragraph
      - inlines:
          - text: At 18th level a Vanguard holds two Advanced Training picks (2 of 8). At 20th a third pick is added, bringing the total to 3 of 8 alongside Deflection Screen, Phase Step, and the full five-feature discipline progression.
            type: text
        type: paragraph
      - inlines:
          - text: Psionic Apex · 18th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: "Your psionic mastery reaches its zenith. You gain the following benefit:"
            type: text
        type: paragraph
      - inlines:
          - text: "Overload Mastery: Once per Short or Long Rest, when you declare your first Overload of a turn, you can activate this feature before paying Blood Tax. Until the end of that turn, including during any additional Attack action from Action Surge, halve the Blood Tax you pay after applying Resistance or any other reduction, rounding down. Overload Mastery can reduce Blood Tax below its normal minimum, but never below 1 damage for an individual Overload."
            type: text
        type: paragraph
      - inlines:
          - text: Advanced Training V · 20th Level · Passive
            type: text
        type: paragraph
      - inlines:
          - text: Choose a third feature from the Advanced Training pool (Section 05). You cannot choose the same feature more than once.
            type: text
        type: paragraph
      - inlines:
          - text: "Swapping: You may replace your chosen feature whenever you gain a Fighter level. There is no Psi cost to swap."
            type: text
        type: paragraph
    id: advanced_training_progression
    kind: system
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    progression_section: reference
    publishable: true
    title: Advanced Training Progression
  - activation: on_hit
    classifications:
      entity_kind: feature
      feature_role: rider
      rules_area:
        - cryokinesis
    content:
      - inlines:
          - text: "T0 Base: The target takes 2 cold damage on hit (fixed, does not scale), and its Speed is reduced by 10 feet until the end of your next turn. This reduction does not stack with itself."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The target must make a Constitution saving throw. On a failed save, Tier 1’s effect that makes its Speed 0 until the end of your next turn replaces the Tier 0 Speed reduction. On a successful save, the Tier 0 Speed reduction remains."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: On a failed save, the Restrained condition until the end of your next turn replaces Tier 1’s effect that makes its Speed 0 for that duration. On a successful save, the Tier 0 Speed reduction remains."
            type: text
        type: paragraph
    id: glacial_spike
    kind: feature
    level: 3
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: cryokinesis
    psi_cost: 0
