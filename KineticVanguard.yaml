entities:
  - classifications:
      entity_kind: system
      rules_area:
        - common_features
    content:
      - inlines:
          - text: On your turn, when you attack with Manifested Strike, your Discipline’s 3rd-level rider is your Signature Rider and costs 0 Psi on every use, even if Overloaded; Blood Tax still applies. Higher-level riders cost their listed Psi. Before each attack roll, declare the rider and its Overload tier. Each hit can carry one rider, and different hits can carry different riders. Any Psi cost and Blood Tax are spent on declaration. On a hit, the declared package resolves; on a miss, the rider does not resolve, but the committed costs remain spent. Manifested Strike itself uses the die set by your Fighter level and is never Overloaded.
            type: text
        type: paragraph
      - inlines:
          - text: Resolve attacks one at a time. Immediately before each attack roll, choose its target and declare that attack’s complete package, including any rider, Overload tier, and damage-type option. Pay all associated Psi and Blood Tax at that time, then roll and fully resolve the attack before declaring the next attack. You do not declare or pay for later attacks in the Attack action in advance. Any unused attacks may target different creatures and use different legal packages based on the battlefield after earlier attacks resolve. Per-Attack-action limits remain spent once used.
            type: text
        type: paragraph
      - inlines:
          - text: "Short Disruption Timing: Unless a feature says otherwise, reaction denial and attack-roll disadvantage imposed by an instantaneous Kinetic Vanguard feature last until the start of your next turn. Hard control conditions use the duration stated by the feature. Zones and recurring-save effects use their own timing."
            type: text
        type: paragraph
      - inlines:
          - text: A rider is an on-hit feature declared as part of a Manifested Strike. Passive and triggered features are not riders unless their text says otherwise. Advanced Training riders include Mind Shred and Mind Lock. A hit can carry either one Discipline rider or one Advanced Training rider, never both. Any rider that uses Manifested Strike dice uses the base die for your Fighter level.
            type: text
        type: paragraph
      - inlines:
          - text: "Rider Target Parity: When a rider creates a chain, arc, burst, Sphere, or other multi-creature effect centered on or originating from the creature struck by Manifested Strike, the struck creature is included among the rider's affected creatures unless the feature's geometry makes a particular effect impossible. Every affected creature resolves the same rider damage, saving throw, conditions, and other applicable effects. A feature may limit how many additional creatures are affected, but the struck creature does not receive a stronger or weaker version of the rider package merely because it was struck."
            type: text
        type: paragraph
      - inlines:
          - text: "Attack Riders and Standalone Actions: You may mix weapon attacks and Manifested Strikes in any order within the Attack action. Each Manifested Strike can carry one rider. Your Signature Rider costs 0 Psi and can be used on any number of Manifested Strike hits in an Attack action; every other attack rider can be used once per Attack action and costs its listed Psi. Different riders may be attached to different hits. Only one rider in each Attack action may be Overloaded to Tier 2. Action Surge creates a new Attack action and refreshes these per-Attack-action limits. You may activate only one standalone psionic feature whose activation requires an Action on each of your turns; Action Surge can still grant another Attack action, but cannot be used to activate a second standalone psionic Action feature. Unless a feature says otherwise, damage from a hit resolves before any saving throw rider tied to that hit."
            type: text
        type: paragraph
      - inlines:
          - text: Your Discipline defines your identity across five features. Deflection Screen (5th) and Phase Step (10th) are universal psionic tools granted to every Vanguard. Advanced Training III, IV, and V (15th, 18th, and 20th) let you pick three of eight high-tier techniques regardless of discipline.
            type: text
        type: paragraph
    id: how_to_play
    kind: system
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: common_features
    progression_section: foundation
    publishable: true
    title: How to Play This Subclass
  - classifications:
      entity_kind: system
      rules_area:
        - common_features
    content:
      - activation:
          - text: The fighter takes the Attack action and targets the creature three times. Attack 1 is Manifested Strike with Ember Bolt Tier 2 for 0 Psi and 8 Blood Tax (2 × PB), paid before the roll. Attack 2 is Manifested Strike with Cinder Lance Tier 0 for 3 Psi and no Blood Tax. Attack 3 is Manifested Strike with Ember Bolt Tier 0 for 0 Psi and no Blood Tax. Every declared cost remains spent on a miss.
            type: text
        damage:
          - text: Attack 1 rolls 8 on its 1d10, dealing 8 + 4 + 6 from Ember Bolt Tier 2 = 18 fire damage. Attack 2 rolls 6 for the strike and 7 and 4 for Cinder Lance’s two additional base Manifested Strike dice, dealing 6 + 7 + 4 + 4 = 21 fire damage. Attack 3 rolls 5, dealing 5 + 4 + 2 from Ember Bolt Tier 0 = 11 fire damage. The creature takes 18 + 21 + 11 = 50 fire damage in total.
            type: text
        discipline: pyrokinesis
        effects:
          - text: These rider tiers add focused damage only. They cause no forced movement, Speed change, condition, or other area effect.
            type: text
        heading:
          - text: Pyrokinesis
            type: text
        result:
          - text: The fighter ends 40 feet from the creature with 7 of 10 Psi, 8 hit points lost to Blood Tax, and no concentration, bonus action, reaction, or movement used. The creature has taken 50 fire damage.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Cha, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 13 + 10 = 23, and 7 + 10 = 17; all three hit AC 16. These Ember Bolt and Cinder Lance tiers require no saving throws.
            type: text
        setup:
          - text: A level 11 Pyrokinesis fighter begins 40 feet from one hostile creature with AC 16 and no fire resistance or immunity. The fighter has three attacks, one free hand, 10 Psi, PB +4, Cha +4, a 1d10 Manifested Strike die, and enough hit points for Blood Tax.
            type: text
        title:
          - text: Focused Fire — Level 11 Pyrokinesis
            type: text
        type: example_play_section
      - activation:
          - text: As a bonus action, the fighter activates standalone Vectored Thrust Tier 1, spends 2 Psi, takes 4 Blood Tax (1 × PB), and begins concentrating for up to 10 minutes. The startup Blood Tax requires no concentration check. The fighter uses the 30-foot fly speed to move 30 feet from the creature without provoking opportunity attacks, then takes the Attack action. Attack 1 adds Telekinetic Shove Tier 0 for 0 Psi; attacks 2 and 3 are plain Manifested Strikes.
            type: text
        damage:
          - text: Attack 1 rolls 7 on its 1d10, dealing 7 + 4 Int + 2 from Telekinetic Shove = 13 force damage. Attack 2 rolls 6, dealing 6 + 4 = 10 force damage. Attack 3 rolls 4, dealing 4 + 4 = 8 force damage. The creature takes 13 + 10 + 8 = 31 force damage in total.
            type: text
        discipline: psychokinesis
        effects:
          - text: The failed Strength save lets the fighter push the creature 10 feet horizontally in a chosen direction. Vectored Thrust remains active through concentration, and the flight provokes no opportunity attacks.
            type: text
        heading:
          - text: Psychokinesis
            type: text
        result:
          - text: The fighter ends flying 30 feet from the creature’s starting position with 8 of 10 Psi, 4 hit points lost to Blood Tax, and concentration on Vectored Thrust. The creature has taken 31 force damage and ends 10 feet from its starting position. The bonus action, movement, and all three attacks are used; no reaction is used.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Int, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 12 + 10 = 22, and 7 + 10 = 17; all three hit AC 16. After attack 1 deals damage, the creature rolls 12 against save DC 16 (8 + 4 + 4) and fails its Strength save.
            type: text
        setup:
          - text: A level 11 Psychokinesis fighter begins within 5 feet of one hostile creature with AC 16. The fighter has three attacks, one free hand, 10 Psi, PB +4, Int +4, a 1d10 Manifested Strike die, enough hit points for Blood Tax, and an open concentration slot.
            type: text
        title:
          - text: Aerial Repositioning — Level 11 Psychokinesis
            type: text
        type: example_play_section
      - activation:
          - text: The fighter remains in place and takes the Attack action. Attack 1 is Manifested Strike with Glacial Spike Tier 0 for 0 Psi and no Blood Tax. Attack 2 is Manifested Strike with Glacial Spike Tier 1 for 0 Psi and 4 Blood Tax (1 × PB), paid before the roll and retained on a miss. Attack 3 is a plain Manifested Strike. No bonus action or reaction is used.
            type: text
        damage:
          - text: Attack 1 rolls 6 on its 1d10, dealing 6 + 4 Int + 2 from Glacial Spike = 12 cold damage. Attack 2 rolls 8, dealing 8 + 4 + 2 = 14 cold damage. Attack 3 rolls 5, dealing 5 + 4 = 9 cold damage. The creature takes 12 + 14 + 9 = 35 cold damage in total.
            type: text
        discipline: cryokinesis
        effects:
          - text: Attack 1 reduces the creature’s Speed by 10 feet. Attack 2’s failed Constitution save makes its Speed 0 until the end of the fighter’s next turn, replacing that reduction. Frozen Ground remains difficult terrain; when the creature starts its next turn in the Cylinder, it makes Frozen Ground’s separate Constitution save.
            type: text
        heading:
          - text: Cryokinesis
            type: text
        result:
          - text: The fighter ends 20 feet from the creature with 8 Psi, 4 hit points lost to Blood Tax, and concentration on Frozen Ground. The creature has taken 35 cold damage and has Speed 0 in difficult terrain until the end of the fighter’s next turn. No Psi, bonus action, reaction, or movement is used this turn.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Int, +4 PB, +2 Psionic Focus). The attacks roll 10 + 10 = 20, 8 + 10 = 18, and 12 + 10 = 22; all three hit AC 16. After attack 2 deals damage, the creature rolls 11 against save DC 16 (8 + 4 + 4) and fails its Constitution save.
            type: text
        setup:
          - text: A level 11 Cryokinesis fighter begins 20 feet from one hostile creature with AC 16 inside the 15-foot-radius Frozen Ground Cylinder. The fighter has three attacks, one free hand, PB +4, Int +4, a 1d10 Manifested Strike die, 8 Psi remaining after activating Frozen Ground last turn for 2 Psi, enough hit points for Blood Tax, and concentration on the difficult-terrain area.
            type: text
        title:
          - text: Frozen Ground Lockdown — Level 11 Cryokinesis
            type: text
        type: example_play_section
      - activation:
          - text: The fighter takes the Attack action and resolves each attack before choosing the next target. Attack 1 declares Manifested Strike with the Static Discharge Signature Rider at Tier 2 for 0 Psi and pays 8 Blood Tax (2 × PB) before the roll. Attack 2 declares Branching Bolt Tier 0 for 2 Psi. Attack 3 declares Electron Burst Tier 0 for 2 Psi. The Psi and Blood Tax remain spent if the associated attack misses.
            type: text
        damage:
          - text: Attack 1 rolls 7 on its 1d10, dealing 7 + 4 = 11 lightning damage to the first primary; Static Discharge adds 2 damage to it and each of four secondaries. Attack 2 rolls 6 for 10 strike damage, and Branching Bolt rolls 8 for the second primary and one secondary. Attack 3 rolls 5 for 9 strike damage, and Electron Burst rolls 6 + 5 = 11 damage against each failed save. Across the five creatures, the turn deals 111 lightning damage.
            type: text
        discipline: electrokinesis
        effects:
          - text: Only each struck primary receives Sap. Static Discharge affects the first primary and four nearby creatures; each fails its Charisma save and loses reactions until the start of the fighter’s next turn. Branching Bolt damages its primary and one chosen secondary. Electron Burst damages all five creatures in its 10-foot-radius Sphere. Secondary targets are damaged but are not hit and do not receive Sap.
            type: text
        heading:
          - text: Electrokinesis
            type: text
        result:
          - text: The fighter ends in place with 6 Psi, 8 hit points lost to Blood Tax, and no concentration, bonus action, reaction, or movement used. The five creatures have taken 111 lightning damage in total; three primaries are struck and Sapped, and all five cannot take reactions until the start of the fighter’s next turn. Static Discharge is the only Tier 2 rider used, while Branching Bolt and Electron Burst are each used once.
            type: text
        rolls_or_saves:
          - text: The attack bonus is +10 (+4 Psionic Ability, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 12 + 10 = 22, and 7 + 10 = 17; all three hit AC 16. Each of the five Static Discharge targets rolls 12 against save DC 16 and fails its Charisma save. Each of the five Electron Burst targets rolls 13 against DC 16 and fails its Charisma save.
            type: text
        setup:
          - text: A level 11 Electrokinesis fighter faces five hostile creatures with AC 16 clustered so four are within 5 feet of the first primary, a later secondary is within 15 feet of the second primary, and all five fit inside the final 10-foot-radius Sphere. The fighter has three attacks, 10 Psi, PB +4, a +4 Psionic Ability modifier, a 1d10 Manifested Strike die, and enough hit points for Blood Tax.
            type: text
        title:
          - text: Room Sweep — Level 11 Electrokinesis
            type: text
        type: example_play_section
    id: common_example_play
    kind: system
