        setup:
          - source_unit_id: u_l0102_c003_blockquote_paragraph_e441f239d1
            text: "Example assumptions: The level 11 Cryokinetic begins 30 feet from one hostile creature (AC 16) with three attacks available, one free hand, 10 Psi, PB 4, Int +3, and enough hit points to pay Blood Tax. They are not concentrating and use no bonus action or reaction this turn."
            type: text
        activation:
          - source_unit_id: u_l0108_c003_blockquote_paragraph_b0a8492967
            text: "The character takes the Attack action. Before attack 1, they target the creature and declare “Manifested Strike with Glacial Spike Tier 2.” Glacial Spike is the 0-Psi Signature Rider; Tier 2 costs 2 × PB = 2 × 4 = 8 Blood Tax, paid immediately and retained even if the attack misses. Manifested Strike itself costs 0 Psi, uses its level-set 1d10 die, and is not Overloaded. Attacks 2 and 3 are plain Manifested Strikes with no rider or additional cost."
            type: text
        rolls_or_saves:
          - source_unit_id: u_l0106_c003_blockquote_paragraph_216ebde730
            text: "The Manifested Strike attack bonus is +9 (+3 Int, +4 PB, +2 Psionic Focus). Attack 1 rolls 12 + 9 = 21 and hits AC 16. The target then rolls 9 against Psionic save DC 15 (8 + 4 + 3) and fails its Constitution save. Attack 2 rolls 8 + 9 = 17 and hits. Attack 3 rolls 4 + 9 = 13 and misses."
            type: text
        damage:
          - source_unit_id: u_l0106_c003_blockquote_paragraph_216ebde730
            text: "Attack 1 rolls 7 on the 1d10: 7 + 3 Int + 2 from Glacial Spike = 12 cold damage. Attack 2 rolls 4: 4 + 3 = 7 cold damage. Attack 3 deals no damage. Total for the turn: 12 + 7 = 19 cold damage."
            type: text
        effects:
          - source_unit_id: u_l0106_c003_blockquote_paragraph_216ebde730
            text: The failed Constitution save applies Glacial Spike Tier 2, so the target is Restrained until the end of the character’s next turn. No movement or other secondary effect occurs.
            type: text
        result:
          - source_unit_id: u_l0110_c003_blockquote_paragraph_fae2c7872a
            text: "The character ends the turn 30 feet from the target with all 10 Psi, having taken 8 psychic damage from Blood Tax. The target has taken 19 cold damage and is Restrained for the stated duration. The Attack action is complete; the missed third attack had no rider costs to lose."
            type: text
      - title:
          - source_unit_id: u_l0112_c003_blockquote_paragraph_1948bc17f9
            text: Focused Fire — Full Attack Turn, Level 11 Pyrokinesis
            type: text
        setup:
          - source_unit_id: u_l0114_c003_blockquote_paragraph_00faccb56f
            text: "Example assumptions: The level 11 Pyrokinetic begins 40 feet from one hostile creature (AC 16) with three attacks available, one free hand, 10 Psi, PB 4, Cha +4, and enough hit points for Blood Tax. The target has no fire resistance or immunity. The character does not move, concentrate, or use a bonus action or reaction."
            type: text
        activation:
          - source_unit_id: u_l0116_c003_blockquote_paragraph_01f5d0059a
            text: "The character takes the Attack action and targets the same creature three times. Before attack 1, they declare Manifested Strike with Ember Bolt Tier 2: 0 Psi and 8 Blood Tax (2 × PB), paid before the roll. Before attack 2, they declare Manifested Strike with Cinder Lance Tier 0: 3 Psi and no Blood Tax. Before attack 3, they declare Manifested Strike with Ember Bolt Tier 0: 0 Psi and no Blood Tax. Each declared Psi cost and Blood Tax remains spent even if that attack misses."
            type: text
        rolls_or_saves:
          - source_unit_id: u_l0118_c003_blockquote_paragraph_2752e68da9
            text: "The Manifested Strike attack bonus is +10 (+4 Cha, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 13 + 10 = 23, and 7 + 10 = 17; all three hit AC 16. None of these Ember Bolt or Cinder Lance tiers calls for a saving throw."
            type: text
        damage:
          - source_unit_id: u_l0120_c003_blockquote_paragraph_5bcd08e236
            text: "Attack 1 rolls 8 on its 1d10, for 8 + 4 + 6 from Ember Bolt Tier 2 = 18 fire damage. Attack 2 rolls 6 for the strike and 7 and 4 for Cinder Lance’s two additional base Manifested Strike dice, for 6 + 7 + 4 + 4 = 21 fire damage. Attack 3 rolls 5, for 5 + 4 + 2 from Ember Bolt Tier 0 = 11 fire damage. Total: 18 + 21 + 11 = 50 fire damage."
            type: text
        effects:
          - source_unit_id: u_l0120_c003_blockquote_paragraph_5bcd08e236
            text: These tiers add focused damage only in this turn; they cause no movement, area, or condition effect.
            type: text
        result:
          - source_unit_id: u_l0122_c003_blockquote_paragraph_7c82271c6b
            text: "The character ends 40 feet from the target with 7 of 10 Psi remaining and 8 fewer hit points from Blood Tax. The primary target has taken 50 fire damage. All three attacks and their separately declared packages are resolved, so the turn ends."
            type: text
      - title:
          - source_unit_id: u_l0124_c003_blockquote_paragraph_a4872a5636
            text: Aerial Repositioning — Sustained Turn, Level 11 Psychokinesis
            type: text
        setup:
          - source_unit_id: u_l0126_c003_blockquote_paragraph_c4607cec5d
            text: "Example assumptions: The level 11 Psychokinetic begins within 5 feet of one hostile creature (AC 16) with three attacks available, one free hand, 10 Psi, PB 4, Int +4, and enough hit points for Blood Tax. Their concentration slot is free, and they want to leave melee range before making ranged Manifested Strikes."
            type: text
        activation:
          - source_unit_id: u_l0128_c003_blockquote_paragraph_5a3fd893c7
            text: "As a bonus action, the character activates standalone Vectored Thrust Tier 1, spends 2 Psi, takes 4 Blood Tax (1 × PB), and begins concentrating for up to 10 minutes. This activation needs no roll, and its startup Blood Tax causes no concentration check. They use the 30-foot fly speed to move to a point 30 feet from the creature without provoking opportunity attacks. They then take the Attack action: attack 1 targets that creature with Manifested Strike and Telekinetic Shove Tier 0 for 0 Psi; attacks 2 and 3 target it with plain Manifested Strikes."
            type: text
        rolls_or_saves:
          - source_unit_id: u_l0130_c003_blockquote_paragraph_37af8865a3
            text: "The Manifested Strike attack bonus is +10 (+4 Int, +4 PB, +2 Psionic Focus). The attacks roll 9 + 10 = 19, 12 + 10 = 22, and 7 + 10 = 17; all hit AC 16. After attack 1 deals damage, the target rolls 12 against Psionic save DC 16 (8 + 4 + 4) and fails its Strength save."
            type: text
        damage:
          - source_unit_id: u_l0132_c003_blockquote_paragraph_a8389e68cc
            text: "Attack 1 rolls 7 on its 1d10, for 7 + 4 Int + 2 from Telekinetic Shove = 13 force damage. Attack 2 rolls 6, for 6 + 4 = 10 force damage. Attack 3 rolls 4, for 4 + 4 = 8 force damage. Total: 13 + 10 + 8 = 31 force damage."
            type: text
        effects:
          - source_unit_id: u_l0134_c003_blockquote_paragraph_ca035bee04
            text: The failed Strength save lets the character push the target 10 feet horizontally in a chosen direction. Vectored Thrust remains active through concentration, and the character’s flight did not provoke opportunity attacks.
            type: text
        result:
          - source_unit_id: u_l0136_c003_blockquote_paragraph_a618462ba0
            text: "The character ends in the chosen flying position, 30 feet from where the target began, with 8 of 10 Psi remaining, 4 fewer hit points from Blood Tax, and concentration on Vectored Thrust. The target has taken 31 force damage and ends 10 feet from its pre-push position. The bonus action, movement, and all three attacks are complete; no reaction was used."
            type: text
      - title:
          - source_unit_id: u_l0138_c003_blockquote_paragraph_c3eaa6f391
            text: Frozen-Ground Lockdown — Level 11 Cryokinesis
            type: text
        setup:
          - source_unit_id: u_l0140_c003_blockquote_paragraph_750364f9e7
            text: "Example assumptions: The level 11 Cryokinetic begins 20 feet from one hostile creature (AC 16) inside the 15-foot-radius Frozen Ground Cylinder. The character has three attacks, one free hand, PB 4, Int +4, and 8 Psi remaining from a 10-Psi reservoir after spending 2 Psi to activate Frozen Ground on the previous turn. They are still concentrating on that difficult-terrain area and have enough hit points for Blood Tax."
            type: text
        activation:
          - source_unit_id: u_l0142_c003_blockquote_paragraph_9ce9acb851
            text: "The character takes the Attack action and remains in place. Before attack 1, they target the creature and declare Manifested Strike with Glacial Spike Tier 0: 0 Psi and no Blood Tax. Before attack 2, they target the same creature and declare Manifested Strike with Glacial Spike Tier 1: 0 Psi and 4 Blood Tax (1 × PB), paid before the roll and retained even if the attack misses. Attack 3 is a plain Manifested Strike with no rider or cost. They use no bonus action or reaction."
            type: text
        rolls_or_saves:
          - source_unit_id: u_l0144_c003_blockquote_paragraph_accd416349
            text: "The Manifested Strike attack bonus is +10 (+4 Int, +4 PB, +2 Psionic Focus). The attacks roll 10 + 10 = 20, 8 + 10 = 18, and 12 + 10 = 22; all hit AC 16. After attack 2 deals damage, the target rolls 11 against Psionic save DC 16 (8 + 4 + 4) and fails its Constitution save."
            type: text
        damage:
          - source_unit_id: u_l0146_c003_blockquote_paragraph_b4480594be
            text: "Attack 1 rolls 6 on its 1d10, for 6 + 4 Int + 2 from Glacial Spike = 12 cold damage. Attack 2 rolls 8, for 8 + 4 + 2 = 14 cold damage. Attack 3 rolls 5, for 5 + 4 = 9 cold damage. Total: 12 + 14 + 9 = 35 cold damage."
            type: text
        effects:
          - source_unit_id: u_l0144_c003_blockquote_paragraph_accd416349
            text: "Attack 1 reduces the target’s Speed by 10 feet. On attack 2, the failed Constitution save makes the target’s Speed 0 until the end of the character’s next turn, replacing that reduction. Frozen Ground remains difficult terrain; when the target starts its upcoming turn in the Cylinder, it must make Frozen Ground’s separate Constitution save."
            type: text
        result:
          - source_unit_id: u_l0148_c003_blockquote_paragraph_e5c8d77618
            text: "The character ends 20 feet from the target with 8 Psi, 4 fewer hit points from Blood Tax, and concentration on Frozen Ground. The target has taken 35 cold damage and has Speed 0 in the difficult-terrain area for the stated duration. The three attacks are complete, and no Psi was spent during this turn."
            type: text
