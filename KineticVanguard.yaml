  - activation: passive
    classifications:
      entity_kind: feature
      feature_role: passive
      rules_area:
        - common_features
    content:
      - inlines:
          - source_unit_id: u_l0232_c001_paragraph_0cad6885e7
            text: "Passive: Your passive Insight (Wisdom) score increases by your Psionic Ability modifier. (If your table does not track a passive Insight score, treat it as 10 + your Wisdom modifier + your Proficiency Bonus if proficient, then add your Psionic Ability modifier from this feature.) Active Scan: As a bonus action, you project a momentary telepathic pulse. At the instant you activate it, you sense the number and direction of creatures within range that harbor hostile intent toward you or a creature you regard as an ally, provided each has a discernible mind and emotions you can read. The scan is instantaneous and does not update if a creature moves, enters or leaves the range, or its intent changes. It does not reveal identity, exact location, thoughts, motive, or intended action. This is a standalone feature; Blood Tax applies on activation if Overloaded. You can use the scan a number of times equal to half your Proficiency Bonus (rounded down), regaining all expended uses on a short or long rest. T0 Base: 15-foot range. T1 Overload: Changes from Tier 0: Range increases to 30 feet. T2 Overload: Changes from Tier 1: Range increases to 60 feet."
            type: text
        type: paragraph
