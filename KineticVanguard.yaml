  - activation: action
    classifications:
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - electrokinesis
    content:
      - body:
          - items:
              - - text: "Concentration: "
                  type: strong
                - text: This effect requires Concentration for up to 1 minute.
                  type: text
              - - text: "Area: "
                  type: strong
                - text: Conjure a hovering orb of lightning that fills a 15-foot-radius Sphere centered on a point within 60 feet.
                  type: text
              - - text: "Trigger and saving throw: "
                  type: strong
                - text: When a creature enters the Sphere for the first time on any turn or starts its turn there, it must make a Charisma saving throw, taking 4d8 lightning damage on a failed save or half as much on a successful one.
                  type: text
              - - text: "Entry limit: "
                  type: strong
                - text: Voluntary or forced movement into the Sphere can trigger this effect, but a creature can trigger it by entering only once per turn.
                  type: text
              - - text: "Movement: "
                  type: strong
                - text: As a bonus action on your turn, you can move the orb up to 15 feet.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Base
            type: text
        tier: 0
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 0:"
                type: text
            type: paragraph
          - inlines:
              - text: The radius increases to 30 feet.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 1:"
                type: text
            type: paragraph
          - items:
              - - text: "Failed save: "
                  type: strong
                - text: A creature that fails its saving throw cannot take reactions and has Disadvantage on attack rolls while inside the Sphere.
                  type: text
              - - text: "Leaving the Sphere: "
                  type: strong
                - text: These effects end immediately when it leaves.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
      - inlines:
          - text: Moving the orb onto a stationary creature does not trigger damage immediately because the creature has not entered the Sphere. The creature must later enter the Sphere or start its turn there to trigger the effect.
            type: text
        type: paragraph
    id: ball_lightning
    kind: feature
    level: 20
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: electrokinesis
    psi_cost: 5
    publishable: true
    requires_concentration: true
    concentration_duration: Up to 1 minute
    title: Ball Lightning
  - activation: reaction
    classifications:
      acquisition_mode: granted
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - body:
          - inlines:
              - text: When you take damage from a source other than yourself, you can use your reaction and spend 1 Psi to reduce the damage by 3d8 + your Psionic Ability modifier. Deflection Screen cannot reduce Blood Tax or other self-inflicted damage.
                type: text
            type: paragraph
        heading:
          - text: Base
            type: text
        tier: 0
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 0:"
                type: text
            type: paragraph
          - inlines:
              - text: The reduction increases to 5d8 + your Psionic Ability modifier.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 1:"
                type: text
            type: paragraph
          - items:
              - - text: "Damage reduction: "
                  type: strong
                - text: The reduction increases to 7d8 + your Psionic Ability modifier.
                  type: text
              - - text: "Originating creature: "
                  type: strong
                - text: If the damage has an originating creature, that creature must make a Strength saving throw.
                  type: text
              - - text: "Failed save: "
                  type: strong
                - text: On a failed save, it is pushed up to 15 feet away from you and knocked Prone.
                  type: text
              - - text: "Successful save: "
                  type: strong
                - text: On a successful save, it is pushed 5 feet away.
                  type: text
              - - text: "No originating creature: "
                  type: strong
                - text: If the damage has no originating creature, such as a trap, environmental effect, or falling damage, the push and Prone effects do not occur; the damage reduction still applies.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
    id: advanced_deflection_screen
    kind: feature
    level: 5
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 1
    publishable: true
    title: Deflection Screen
  - activation: bonus_action
    classifications:
      acquisition_mode: granted
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: Teleport up to 15 feet to an unoccupied space you can see. This movement does not provoke Opportunity Attacks."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The teleport range increases to 30 feet."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: Choose either the space you left or the space where you appear. Each creature of your choice within 5 feet of that space must make your Discipline’s signature saving throw against your Psionic saving throw Difficulty Class. On a failed save, it cannot take reactions until the start of your next turn."
            type: text
        type: paragraph
    id: advanced_phase_step
    kind: feature
    level: 10
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 1
    publishable: true
    title: Phase Step
  - activation: on_hit
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: rider
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: The target takes 2d8 psychic damage, with no saving throw."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The psychic damage increases to 3d8."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: The psychic damage increases to 4d8 and ignores Resistance to psychic damage."
            type: text
        type: paragraph
    id: advanced_mind_shred
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    title: Mind Shred
  - activation: action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - body:
          - inlines:
              - text: Choose one tier when you activate Beguile; higher tiers replace lower-tier effects rather than stacking with them.
                type: text
            type: paragraph
          - items:
              - - text: "Effect: "
                  type: strong
                - text: Produce the effects of charm person without casting a spell.
                  type: text
              - - text: "Saving throw: "
                  type: strong
                - text: The target makes a Charisma saving throw against your Psionic saving throw Difficulty Class.
                  type: text
              - - text: "Concentration: "
                  type: strong
                - text: The effect requires Concentration for up to 1 hour.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Base
            type: text
        tier: 0
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 0:"
                type: text
            type: paragraph
          - items:
              - - text: "Effect: "
                  type: strong
                - text: Replace the charm person effect with the effects of suggestion without casting a spell.
                  type: text
              - - text: "Saving throw: "
                  type: strong
                - text: The target makes a Charisma saving throw against your Psionic saving throw Difficulty Class.
                  type: text
              - - text: "Concentration: "
                  type: strong
                - text: The effect requires Concentration for up to 8 hours.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 1:"
                type: text
            type: paragraph
          - items:
              - - text: "Effect: "
                  type: strong
                - text: Replace the suggestion effect with the effects of mass suggestion without casting a spell, affecting up to five creatures you can see within 60 feet.
                  type: text
              - - text: "Saving throw: "
                  type: strong
                - text: Each target makes a Charisma saving throw against your Psionic saving throw Difficulty Class.
                  type: text
              - - text: "Concentration: "
                  type: strong
                - text: The effect requires Concentration for up to 8 hours.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
      - items:
          - - text: "Classification: "
              type: strong
            - text: Beguile is a magical standalone Action, not a spell or rider.
              type: text
          - - text: "Components: "
              type: strong
            - text: It requires no spell components.
              type: text
          - - text: "Countermagic and spell triggers: "
              type: strong
            - text: It cannot be Counterspelled or dispelled, and does not trigger features that require casting a spell.
              type: text
          - - text: "Saving throw: "
              type: strong
            - text: Its saving throw is always Charisma, regardless of your Discipline.
              type: text
        style: unordered
        type: list
    id: advanced_beguile
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    requires_concentration: true
    concentration_duration: Varies by tier
    title: Beguile
  - activation: on_hit
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: rider
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: The target is Blinded until the end of your next turn, with no saving throw."
            type: text
        type: paragraph
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: The target must also make an Intelligence saving throw. On a failed save, it is Incapacitated until the end of your next turn."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: On a failed save, the target is Stunned instead of Incapacitated until the end of your next turn. It remains Blinded as at Tier 0."
            type: text
        type: paragraph
    id: advanced_mind_lock
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    title: Mind Lock
  - activation: action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - body:
          - inlines:
              - text: This effect requires Concentration for up to 1 minute. Create a 15-foot-radius, 20-foot-high Cylinder of intensified gravity centered on a point within 60 feet.
                type: text
            type: paragraph
          - items:
              - - text: "Terrain and Speed: "
                  type: strong
                - text: The area is difficult terrain for the duration, and each creature in it has its Speed halved without a saving throw.
                  type: text
              - - text: "Flying creatures: "
                  type: strong
                - text: A flying creature that enters the Cylinder or starts its turn there immediately falls, taking falling damage as normal, and cannot fly or gain a fly Speed while it remains there.
                  type: text
              - - text: "Saving throw: "
                  type: strong
                - text: A creature that enters the Cylinder for the first time on a turn or starts its turn there must make a Strength saving throw.
                  type: text
              - - text: "Failed save: "
                  type: strong
                - text: On a failed save, it cannot take reactions until the start of its next turn.
                  type: text
              - - text: "Successful save: "
                  type: strong
                - text: On a successful save, it suffers no additional effect.
                  type: text
            style: unordered
            type: list
        heading:
          - text: Base
            type: text
        tier: 0
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 0: Creatures in the Cylinder have Disadvantage on attack rolls."
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 1: A creature that fails the saving throw also has its Speed reduced to 0 until the start of its next turn."
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
    id: advanced_gravitic_press
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    requires_concentration: true
    concentration_duration: Up to 1 minute
    title: Gravitic Press
  - activation: bonus_action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - inlines:
          - text: "T0 Base: This effect requires Concentration for up to 1 minute. Choose one of the following effects."
            type: text
        type: paragraph
      - items:
          - - text: "Blade Shield: You have Resistance to bludgeoning, piercing, and slashing damage from weapon attacks."
              type: text
          - - text: "Elemental Shroud: Choose acid, cold, fire, lightning, or thunder; you have Resistance to that damage type."
              type: text
          - - text: "Spellward: You have Advantage on saving throws against spells."
              type: text
          - - text: "Steadfast Guard: You have Advantage on Strength saving throws and on ability checks and saving throws made to resist being Grappled, shoved, knocked Prone, or forcibly moved."
              type: text
          - - text: "Mental Bulwark: You have Advantage on saving throws against being Charmed, Frightened, Blinded, Restrained, Incapacitated, Paralyzed, or Stunned."
              type: text
        style: unordered
        type: list
      - inlines:
          - text: "T1 Overload: Changes from Tier 0: Choose two of the five effects instead of one."
            type: text
        type: paragraph
      - inlines:
          - text: "T2 Overload: Changes from Tier 1: The duration increases to 10 minutes. While Barrier is active and you are not in Initiative, you can spend 1 Psi to replace one chosen effect with another effect from the list. If Elemental Shroud is active, you can instead change its damage type. You cannot choose an effect that is already active."
            type: text
        type: paragraph
    id: advanced_barrier
    kind: feature
    level: 15
    presentation_metadata:
      canonical_topic_by_area: {}
      primary_rules_area: advanced_training
    psi_cost: 3
    publishable: true
    requires_concentration: true
    concentration_duration: Varies by tier
    title: Barrier
  - activation: bonus_action
    classifications:
      acquisition_mode: selectable
      entity_kind: feature
      feature_role: standalone
      rules_area:
        - advanced_training
    content:
      - body:
          - items:
              - - text: Teleport up to 30 feet to an unoccupied space you can see.
                  type: text
              - - text: Choose either the space you left or the space where you appear as the origin of a 5-foot-radius Sphere.
                  type: text
              - - text: Choose up to three other creatures in the Sphere.
                  type: text
              - - text: Each chosen creature must make your Discipline’s signature saving throw against your Psionic saving throw Difficulty Class, taking 2d10 damage of your Manifested Strike’s damage type on a failed save or half as much on a successful one.
                  type: text
            style: ordered
            type: list
          - inlines:
              - text: This movement does not provoke Opportunity Attacks, and you are unaffected by the burst.
                type: text
            type: paragraph
        heading:
          - text: Base
            type: text
        tier: 0
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 0:"
                type: text
            type: paragraph
          - inlines:
              - text: The teleport range increases to 60 feet, and the burst damage increases to 3d10.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 1
        type: tier
      - body:
          - inlines:
              - text: "Changes from Tier 1:"
                type: text
            type: paragraph
          - inlines:
              - text: The burst damage increases to 4d10. A creature that fails the saving throw also cannot take reactions until the start of your next turn.
                type: text
            type: paragraph
        heading:
          - text: Overload
            type: text
        tier: 2
        type: tier
    id: advanced_improved_phase_step
    kind: feature
    level: 15
    presentation_metadata:
