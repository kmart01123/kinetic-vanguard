  - assertion: Every publishable rule entity is authored directly in KineticVanguard.yaml.
    id: yaml_rules_authority
    subject_ids:
      - how_to_play
      - common_example_play
      - subclass_feature_reference
      - common_psionic_discipline
      - common_discipline_signature_save
      - common_psi_reservoir
      - common_psionic_link
      - common_manifested_strike
      - common_overload
      - common_signature_rider
      - common_kinetic_mastery
      - common_empathic_sense
      - common_vanguard_training
      - advanced_training_progression
      - glacial_spike
      - snow_chains
      - frozen_ground
      - arctic_tempest
      - absolute_zero
      - ember_bolt
      - thermal_fracture
      - cinder_lance
      - flare
      - furnace_strike
      - telekinetic_shove
      - vectored_thrust
      - explosion_implosion
