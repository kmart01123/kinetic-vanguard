name: Publish v13.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v13.1.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v13.1.0
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/13.1.0
  RELEASE_TAG: v13.1.0
  RELEASE_SHA: fcebb1a820ceb1fcf499fdb1a26278ebeeed5bf0

jobs:
  publish:
    name: Verify snapshot and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out frozen release snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Verify frozen release commit
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build prototype
        run: npm run build

      - name: Test determinism
        run: npm run test:determinism

      - name: Test layout
        run: npm run test:layout

      - name: Build authorized release
        env:
          KV_RELEASE_APPROVED: "1"
        run: npm run build:release

      - name: Verify release identity
        run: |
          test -f artifacts/KineticVanguard.html
          grep -q '"release_status":"release"' artifacts/KineticVanguard.html
          grep -q '"rules_version":"13.1.0"' artifacts/KineticVanguard.html
          ! grep -q '<p class="prototype"' artifacts/KineticVanguard.html

      - name: Create annotated release tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_sha" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Kinetic Vanguard v13.1.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Kinetic Vanguard v13.1.0 is a substantial rules and reference update focused on clarity, consistency, newcomer readability, and practical table use.

          Highlights include a complete language audit of all 44 publishable rules entities; explicit permanent Kinetic Discipline selection; clarified Overload concentration startup and Forked Lightning outcomes; fixed concentration durations; unambiguous Mass Levitation targeting; tier-aware Ongoing Duration reference data; newcomer-focused rewrites of the core rules and example turns; improved mobile navigation and semantic headings; and local filters for the 34-row Subclass Feature Reference.

          The release is built and verified from the frozen `release/13.1.0` snapshot at commit `fcebb1a820ceb1fcf499fdb1a26278ebeeed5bf0`.

          Download `KineticVanguard.html` for the complete self-contained, offline-capable rules reference. The remaining assets document build integrity, filtered-search integrity, and coverage provenance.

          New-player Start Here onboarding is planned separately for v13.2.0.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Kinetic Vanguard v13.1.0" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Kinetic Vanguard v13.1.0" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            artifacts/KineticVanguard.html \
            artifacts/build-manifest.json \
            artifacts/filtered-search-integrity.json \
            artifacts/coverage-ledger.json \
            --clobber
