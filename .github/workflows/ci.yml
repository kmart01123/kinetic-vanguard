name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  main_branch_gate:
    name: Main branch gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Check changelog impact
        run: npm exec -- tsx src/changelog-impact.ts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test developer tools
        run: npm run test:tools

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Validate harness authority projection
        run: npm run harness:validate

      - name: Test harnesses
        run: npm run test:harness

      - name: Build prototype
        run: npm run build

      - name: Check diff
        run: git diff --check
