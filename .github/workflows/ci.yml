name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Read canonical rules version
    runs-on: ubuntu-24.04
    outputs:
      rules_version: ${{ steps.rules-version.outputs.rules_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - id: rules-version
        name: Read rules version from canonical authority
        run: |
          rules_version="$(sed -n 's/^rules_version: //p' KineticVanguard.yaml)"
          test -n "$rules_version"
          echo "rules_version=$rules_version" >> "$GITHUB_OUTPUT"

  verification:
    needs: metadata
    name: v${{ needs.metadata.outputs.rules_version }} verification and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build prototype
        run: npm run build

      - name: Test determinism
        run: npm run test:determinism

      - name: Test layout
        run: npm run test:layout

      - name: Build authorized v${{ needs.metadata.outputs.rules_version }} release
        env:
          KV_RELEASE_APPROVED: "1"
        run: npm run build:release

      - name: Verify v${{ needs.metadata.outputs.rules_version }} release identity
        run: |
          test -f artifacts/KineticVanguard.html
          grep -q '"release_status":"release"' artifacts/KineticVanguard.html
          grep -q '"rules_version":"${{ needs.metadata.outputs.rules_version }}"' artifacts/KineticVanguard.html
          ! grep -q '<p class="prototype"' artifacts/KineticVanguard.html

      - name: Upload v${{ needs.metadata.outputs.rules_version }} publication
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-vanguard-v${{ needs.metadata.outputs.rules_version }}
          if-no-files-found: error
          retention-days: 90
          path: |
            artifacts/KineticVanguard.html
            artifacts/build-manifest.json
            artifacts/filtered-search-integrity.json
            artifacts/coverage-ledger.json

  # BEGIN TEMPORARY LICENSING APPLIER
  apply_licensing:
    name: Apply approved split licensing
    if: ${{ github.event_name == 'pull_request' && github.head_ref == '13.2.0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out shared development branch
        uses: actions/checkout@v7
        with:
          ref: 13.2.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.16.0

      - name: Apply approved license model
        run: |
          python .github/apply-v13.2.0-licensing.py
          python .github/fix-v13.2.0-license-test.py
          python .github/fix-v13.2.0-license-layout.py

      - name: Remove one-shot implementation files and temporary CI job
        run: |
          rm .github/apply-v13.2.0-licensing.py
          rm .github/fix-v13.2.0-license-test.py
          rm .github/fix-v13.2.0-license-layout.py
          rm .github/workflows/apply-v13.2.0-licensing.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '  # BEGIN TEMPORARY LICENSING APPLIER\n'
          end_marker = '  # END TEMPORARY LICENSING APPLIER\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build prototype
        run: npm run build

      - name: Test determinism
        run: npm run test:determinism

      - name: Test layout
        run: npm run test:layout

      - name: Build authorized release
        env:
          KV_RELEASE_APPROVED: "1"
        run: npm run build:release

      - name: Check patch formatting
        run: git diff --check

      - name: Commit and push verified non-workflow changes
        run: |
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/apply-v13.2.0-licensing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE.md LICENSE-CODE LICENSE-CONTENT NOTICE.md KineticVanguard.yaml src/render.ts tests/license-contract.test.ts tests/architecture.test.ts CHANGELOG.md
          git add -A -- .github/apply-v13.2.0-licensing.py .github/fix-v13.2.0-license-test.py .github/fix-v13.2.0-license-layout.py
          git commit -m "chore: adopt split project licensing"
          git push origin HEAD:13.2.0
  # END TEMPORARY LICENSING APPLIER

  main_branch_gate:
    name: Main branch gate
    needs:
      - metadata
      - verification
    if: ${{ always() }}
    runs-on: ubuntu-24.04

    steps:
      - name: Require successful verification
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: |
          test "$METADATA_RESULT" = "success"
          test "$VERIFICATION_RESULT" = "success"
