name: Branch hygiene audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-hygiene-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Find stale non-release branches
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit repository branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/branch-hygiene-audit.mjs
