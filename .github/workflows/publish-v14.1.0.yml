name: Publish v14.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v14.1.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v14.1.0
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/14.1.0
  RELEASE_TAG: v14.1.0
  RELEASE_SHA: 40d0d191e7ef3ba7be7a3ed6f5f4c0e1c6059bef

jobs:
  publish:
    name: Verify snapshot and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out frozen release snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Verify frozen release commit
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Validate harness authority projection
        run: npm run harness:validate

      - name: Test harnesses
        run: npm run test:harness

      - name: Verify README benchmark matrices
        run: npm run readme:benchmarks:check

      - name: Build prototype
        run: npm run build

      - name: Test determinism
        run: npm run test:determinism

      - name: Test layout
        run: npm run test:layout

      - name: Build authorized release
        env:
          KV_RELEASE_APPROVED: "1"
        run: npm run build:release

      - name: Generate permanent benchmark evidence
        run: |
          npm run harness:damage -- --output-dir artifacts/release-evidence/damage
          npm run harness:control -- --output-dir artifacts/release-evidence/control

      - name: Verify release identity, evidence, and legal assets
        run: |
          test -f artifacts/KineticVanguard.html
          grep -q '"release_status":"release"' artifacts/KineticVanguard.html
          grep -q '"rules_version":"14.1.0"' artifacts/KineticVanguard.html
          ! grep -q '<p class="prototype"' artifacts/KineticVanguard.html
          ! grep -q 'Application version' artifacts/KineticVanguard.html
          ! grep -q '"application_version"' artifacts/KineticVanguard.html
          ! grep -q '"application_version"' artifacts/build-manifest.json
          test -f artifacts/release-evidence/damage/kv-14-1-0-damage-comparison-matrix.csv
          test -f artifacts/release-evidence/damage/kv-14-1-0-damage-comparison-matrix.md
          test -f artifacts/release-evidence/damage/kv-14-1-0-damage-comparison-matrix.html
          test -f artifacts/release-evidence/control/kv-14-1-0-control-comparison-matrix.csv
          test -f artifacts/release-evidence/control/kv-14-1-0-control-comparison-matrix.md
          test -f artifacts/release-evidence/control/kv-14-1-0-control-comparison-matrix.html
          test -f artifacts/release-evidence/control/kv-14-1-0-control-selection-audit.csv
          test -f LICENSE.md
          test -f LICENSE-CODE
          test -f LICENSE-CONTENT
          test -f NOTICE.md

      - name: Check repository formatting
        run: git diff --check

      - name: Create annotated release tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_sha" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Kinetic Vanguard v14.1.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Kinetic Vanguard v14.1.0 restores the project’s maintained damage and control benchmark infrastructure and completes the v14 Calculator navigation pass.

          The restored harnesses consume KineticVanguard.yaml as the sole Kinetic Vanguard rules authority, use deterministic exact analytical enumeration, retain Battle Master and Eldritch Knight as isolated primary comparators, and report dynamic min/max comparison envelopes with COLD, IDEAL, HOT, and N/A classifications. The independent numerical review status is REVIEWED_WITH_DOCUMENTED_DIFFERENCES; this release does not claim a new Monte Carlo certification.

          The README now carries synchronized single-target damage and Control Reliability heat matrices derived from fresh full-roster analysis, while the permanent release assets include the complete damage/control comparison matrices and the control selection audit. The repository-wide licensing audit also preserves component-level BSD-3-Clause, CC BY-NC-SA 4.0, and SRD CC BY 4.0 boundaries across source, generated publications, benchmark reports, and deployable legal assets.

          The offline Calculator adds a Feature Group selector for all four Kinetic Disciplines and Advanced Training. It opens on a dedicated Manifested Strike landing card, derives grouping from canonical authority, preserves legal selections across group changes, and changes navigation only—not rules or calculations.

          The frozen release/14.1.0 snapshot is commit 40d0d191e7ef3ba7be7a3ed6f5f4c0e1c6059bef. Release-candidate CI passed 74 application tests, 68 harness tests, 11 Chromium/Firefox layout tests, deterministic builds, the authorized release build, exact README benchmark synchronization, and the stable Main branch gate.

          Download KineticVanguard.html for the complete self-contained player-facing publication. The additional matrix CSV/Markdown/HTML files and control selection-audit CSV are permanent analytical evidence for this release.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Kinetic Vanguard v14.1.0" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Kinetic Vanguard v14.1.0" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            artifacts/KineticVanguard.html \
            artifacts/build-manifest.json \
            artifacts/filtered-search-integrity.json \
            artifacts/coverage-ledger.json \
            LICENSE.md \
            LICENSE-CODE \
            LICENSE-CONTENT \
            NOTICE.md \
            artifacts/release-evidence/damage/kv-14-1-0-damage-comparison-matrix.csv \
            artifacts/release-evidence/damage/kv-14-1-0-damage-comparison-matrix.md \
            artifacts/release-evidence/damage/kv-14-1-0-damage-comparison-matrix.html \
            artifacts/release-evidence/control/kv-14-1-0-control-comparison-matrix.csv \
            artifacts/release-evidence/control/kv-14-1-0-control-comparison-matrix.md \
            artifacts/release-evidence/control/kv-14-1-0-control-comparison-matrix.html \
            artifacts/release-evidence/control/kv-14-1-0-control-selection-audit.csv \
            --clobber
