name: Publish v13.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v13.2.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v13.2.0
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/13.2.0
  RELEASE_TAG: v13.2.0
  RELEASE_SHA: c03730295805a0cf38f943da87570c6d85eb7ad3

jobs:
  publish:
    name: Verify snapshot and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out frozen release snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Verify frozen release commit
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build prototype
        run: npm run build

      - name: Test determinism
        run: npm run test:determinism

      - name: Test layout
        run: npm run test:layout

      - name: Build authorized release
        env:
          KV_RELEASE_APPROVED: "1"
        run: npm run build:release

      - name: Verify release identity and legal assets
        run: |
          test -f artifacts/KineticVanguard.html
          grep -q '"release_status":"release"' artifacts/KineticVanguard.html
          grep -q '"rules_version":"13.2.0"' artifacts/KineticVanguard.html
          ! grep -q '<p class="prototype"' artifacts/KineticVanguard.html
          test -f LICENSE.md
          test -f LICENSE-CODE
          test -f LICENSE-CONTENT
          test -f NOTICE.md

      - name: Check repository formatting
        run: git diff --check

      - name: Create annotated release tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_sha" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Kinetic Vanguard v13.2.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Kinetic Vanguard v13.2.0 makes the rules reference substantially easier for a new player to enter while preserving the complete experienced-player reference.

          The new default Start Here experience introduces Manifested Strike, riders, Psi, Overload, Blood Tax, character setup, and the four Kinetic Disciplines through canonical links. Existing category, topic, entity, and filter deep links remain compatible, and Start Here / Rules Reference navigation preserves browser history, keyboard focus, responsive layouts, offline use, and print output.

          Mass Levitation now uses five target slots: a Medium or smaller creature costs one slot, a Large creature costs two slots, and mixed groups are legal up to the five-slot limit. A creature that succeeds on a repeat saving throw now falls normally from its current position instead of descending safely.

          This release also adopts component-based licensing: BSD-3-Clause for software and tooling, CC BY-NC-SA 4.0 for original Kinetic Vanguard content, and CC BY 4.0 for SRD 5.2.1-derived material. The legal files are included with the release assets.

          The frozen `release/13.2.0` snapshot is commit `c03730295805a0cf38f943da87570c6d85eb7ad3`. It validates all 44 canonical rules entities and passes 57 automated tests, 10 Chromium and Firefox layout tests, deterministic-build verification, and the authorized release build.

          Download `KineticVanguard.html` for the complete self-contained publication.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Kinetic Vanguard v13.2.0" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Kinetic Vanguard v13.2.0" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            artifacts/KineticVanguard.html \
            artifacts/build-manifest.json \
            artifacts/filtered-search-integrity.json \
            artifacts/coverage-ledger.json \
            LICENSE.md \
            LICENSE-CODE \
            LICENSE-CONTENT \
            NOTICE.md \
            --clobber
