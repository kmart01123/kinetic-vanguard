name: Publish v14.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v14.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v14.0.0
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/14.0.0
  RELEASE_TAG: v14.0.0
  RELEASE_SHA: d2d31b47fd1672f3c7d03db3ddb4480eadf4cd1c

jobs:
  publish:
    name: Verify snapshot and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out frozen release snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Verify frozen release commit
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox

      - name: Typecheck
        run: npm run typecheck

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build prototype
        run: npm run build

      - name: Test determinism
        run: npm run test:determinism

      - name: Test layout
        run: npm run test:layout

      - name: Build authorized release
        env:
          KV_RELEASE_APPROVED: "1"
        run: npm run build:release

      - name: Verify release identity and legal assets
        run: |
          test -f artifacts/KineticVanguard.html
          grep -q '"release_status":"release"' artifacts/KineticVanguard.html
          grep -q '"rules_version":"14.0.0"' artifacts/KineticVanguard.html
          ! grep -q '<p class="prototype"' artifacts/KineticVanguard.html
          ! grep -q 'Application version' artifacts/KineticVanguard.html
          ! grep -q '"application_version"' artifacts/KineticVanguard.html
          ! grep -q '"application_version"' artifacts/build-manifest.json
          test -f LICENSE.md
          test -f LICENSE-CODE
          test -f LICENSE-CONTENT
          test -f NOTICE.md

      - name: Check repository formatting
        run: git diff --check

      - name: Create annotated release tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_sha" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Kinetic Vanguard v14.0.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Kinetic Vanguard v14.0.0 adds the deterministic offline Calculator and delivers the accompanying major rules, authority-schema, and publication updates.

          The Calculator derives Manifested Strike attack, damage, and Psionic Save DC values from Skill / Feature, Fighter Level, and Psionic Ability Modifier selections. Supported on-hit riders and standalone features remain tier-aware, display total Psi Points, Psi cost, Blood Tax, source-derived damage math, and exact expected average values without display rounding.

          Version 14 also makes Barrier require Concentration for up to 1 minute at Tier 0 and Tier 1, while Tier 2 retains its 10-minute duration; aligns Explosion/Implosion Tier 1 radius and forced movement at 30 feet; migrates worked examples and dense rule sequences to semantic lists; advances the authority schema to 2.0.0; and removes the separate application-version identity so the canonical rules version is the sole product version.

          The frozen `release/14.0.0` snapshot is commit `d2d31b47fd1672f3c7d03db3ddb4480eadf4cd1c`. It passes 66 automated tests, 11 Chromium and Firefox layout tests, deterministic-build verification, and the authorized release build.

          Download `KineticVanguard.html` for the complete self-contained publication.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Kinetic Vanguard v14.0.0" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Kinetic Vanguard v14.0.0" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            artifacts/KineticVanguard.html \
            artifacts/build-manifest.json \
            artifacts/filtered-search-integrity.json \
            artifacts/coverage-ledger.json \
            LICENSE.md \
            LICENSE-CODE \
            LICENSE-CONTENT \
            NOTICE.md \
            --clobber
