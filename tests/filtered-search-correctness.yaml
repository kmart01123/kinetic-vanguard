version: 1
review_status: accepted
review_basis: "Maintainer release approval under ADR-0001 revision 22; independent second-pass requirement waived for v13.0."
cases:
  - id: electrokinesis_rider
    selections:
      rules_area: [electrokinesis]
      feature_role: [rider]
    expected_result_ids: [branching_bolt, electron_burst, static_discharge]
    must_not_include: [ball_lightning, common_overload]
    derivation_method: "Manual reading of the pinned Electrokinesis feature headers."
    reviewer: "Kyle Martin (maintainer)"
  - id: advanced_training_granted
    selections:
      rules_area: [advanced_training]
      acquisition_mode: [granted]
    expected_result_ids: [advanced_deflection_screen, advanced_phase_step]
    must_not_include: [advanced_mind_shred]
    derivation_method: "Manual reading of the Advanced Training granted-feature headings."
    reviewer: "Kyle Martin (maintainer)"
  - id: advanced_training_selectable
    selections:
      rules_area: [advanced_training]
      acquisition_mode: [selectable]
    expected_result_ids: [advanced_barrier, advanced_beguile, advanced_gravitic_press, advanced_improved_phase_step, advanced_inner_reserve, advanced_mind_lock, advanced_mind_shred, advanced_overload_mastery_ii]
    must_not_include: [advanced_deflection_screen, advanced_phase_step]
    derivation_method: "Manual reading of the high-tier Advanced Training pool."
    reviewer: "Kyle Martin (maintainer)"
  - id: multi_area_or
    selections:
      rules_area: [cryokinesis, pyrokinesis]
    expected_result_ids: [absolute_zero, arctic_tempest, cinder_lance, ember_bolt, flare, frozen_ground, furnace_strike, glacial_spike, snow_chains, thermal_fracture]
    must_not_include: [ball_lightning, telekinetic_shove]
    derivation_method: "Manual union of entities canonically classified in the two selected disciplines; secondary navigation routes do not broaden the result."
    reviewer: "Kyle Martin (maintainer)"
  - id: cross_area
    selections:
      entity_kind: [system]
      rules_area: [electrokinesis]
    expected_result_ids: []
    must_not_include: [how_to_play, common_overload]
    derivation_method: "No system entity has Electrokinesis as its canonical displayed rules area."
    reviewer: "Kyle Martin (maintainer)"
  - id: deliberately_empty
    selections:
      entity_kind: [progression]
      rules_area: [electrokinesis]
    expected_result_ids: []
    must_not_include: [subclass_feature_reference]
    derivation_method: "No progression entity is rendered in Electrokinesis."
    reviewer: "Kyle Martin (maintainer)"
  - id: no_selection
    selections: {}
    expected_result_ids: []
    must_not_include: []
    expected_state: instruction
    derivation_method: "Interaction-policy no-selection rule."
    reviewer: "Kyle Martin (maintainer)"
  - id: saturated_metadata_only
    selections:
      rules_area: [common_features, advanced_training, cryokinesis, pyrokinesis, psychokinesis, electrokinesis]
    expected_result_ids: []
    expected_set: all_publishable_entities
    must_not_include: []
    expected_content: metadata_only
    derivation_method: "All finite rules-area values selected using within-facet OR."
    reviewer: "Kyle Martin (maintainer)"
